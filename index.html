<style>
:root{--bg:#f4f7fc;--c:#fff;--tx:#0d1b3d;--mu:#5b6785;--bd:#dce3f0;--pk:#f2457a;--bl:#1f5aa6;--gr:#1fae84;--or:#e07b00;--pu:#2a55a3;--soft:#ffe8f0;--hd:#0b2a63;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header b{font-size:18px}header small{display:block;font-size:11px;opacity:.9}
#mb{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:12px;width:42px;height:38px;display:grid;place-items:center;padding:0}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a,nav button{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;text-align:center;padding:8px 2px;color:var(--mu);text-decoration:none;font-size:11px}
nav a span,nav button span{display:block;font-size:19px;line-height:1.2}
nav a.on,nav button.on{color:var(--pk);font-weight:700}
#mpop{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
#mpop a{width:66px;height:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);border:1px solid var(--bd);box-shadow:0 6px 18px rgba(0,0,0,.3);color:var(--tx);text-decoration:none;font-size:11px;line-height:1.2;opacity:0;transform:translateY(18px) scale(.5);transition:opacity .18s,transform .22s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#mpop a:nth-child(1),#mpop a:nth-child(4){--dy:14px}
#mpop.on a{opacity:1;pointer-events:auto;transform:translateY(var(--dy,0)) scale(1)}
#mpop.on a:nth-child(2){transition-delay:.03s}#mpop.on a:nth-child(3){transition-delay:.06s}#mpop.on a:nth-child(4){transition-delay:.09s}
#mpop a span{font-size:22px;line-height:1.1}
#mpop a.on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
input[type=search],select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);font-size:16px;margin-bottom:10px}
details{background:var(--c);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details.g>summary{font-weight:700;color:var(--pk)}
details.g>summary small{margin-left:auto;color:var(--mu);font-weight:400}
details.g>div{padding:0 10px 4px}
.no{background:var(--pk);color:#fff;border-radius:50%;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ok{color:var(--gr);font-style:normal;margin-left:auto}
.bd{padding:2px 14px 14px}
.bd p{margin:6px 0}.bd em{font-style:normal;font-weight:700;color:var(--bl);margin-right:6px}
.ex{background:var(--soft);border-radius:10px;padding:6px 10px;margin:8px 0;font-size:17px;line-height:2}
.ex i{display:block;font-size:13px;color:var(--mu);line-height:1.4;padding-bottom:4px}
.nt{font-size:14px;color:var(--mu)}
rt{font-size:.5em}
.btn{background:var(--pk);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600}
.btn.alt{background:var(--c);color:var(--tx);border:1px solid var(--bd)}
.btn.g{background:var(--gr)}.btn.o{background:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;padding:2px 0 10px}
.tile{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:28px;color:var(--tx);line-height:1.2}
.tile small{display:block;font-size:10px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tile.dn{background:var(--soft);border-color:var(--gr)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet>div{background:var(--c);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.big{font-size:72px;line-height:1.1;text-align:center;color:var(--pk)}
.row{margin:6px 0;font-size:15px}.row em{font-style:normal;font-weight:700;color:var(--pu);margin-right:6px}
.kv{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:15px}
.fc{background:var(--c);border:2px solid var(--bd);border-radius:22px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:10px 0;cursor:pointer}
.fc .big{font-size:96px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gr)}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--bd);color:var(--tx);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:17px}
.opt.right{border-color:var(--gr);background:rgba(31,174,132,.15)}.opt.bad{border-color:var(--pk);background:rgba(255,92,147,.15)}
.q{font-size:20px;line-height:2.1;margin:8px 0}
h2{font-size:19px;margin:6px 0 10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap}.flex>*{flex:1}
.mu{color:var(--mu);font-size:14px}
.ex{display:flex;align-items:flex-start;gap:8px}.ex>div{flex:1}

const D={"bp":[{"g":"Dugaan & Penilaian","items":[{"t":"～ようだ","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + ようだ","m":"Tampaknya, seperti. Penilaian dari kesan atau pengamatan langsung pembicara.","ex":[["彼(かれ)は顔色(かおいろ)が悪(わる)いから、熱(ねつ)があるようだ。","Wajahnya pucat, sepertinya dia demam."],["部屋(へや)の電気(でんき)が消(き)えている。もう寝(ね)たようだ。","Lampu kamarnya mati. Sepertinya dia sudah tidur."]],"n":"Berdasarkan pengamatan sendiri. Juga dipakai untuk perumpamaan (夢のようだ = seperti mimpi)."},{"t":"～みたいだ","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + みたいだ","m":"Sepertinya, seperti. Bentuk lisan dari ～ようだ.","ex":[["あの人(ひと)は外国人(がいこくじん)みたいだ。","Orang itu sepertinya orang asing."],["今日(きょう)はまるで夏(なつ)みたいに暑(あつ)い。","Hari ini panas seperti musim panas."]],"n":"Lebih santai, kurang cocok untuk tulisan formal."},{"t":"～そうだ（様子(ようす)）","r":"V bentuk ます (tanpa ます) / Adj-i tanpa い / Adj-na tanpa だ + そうだ","m":"Tampaknya akan ..., kelihatannya ... (kesan dari penampilan atau tanda-tanda).","ex":[["雨(あめ)が降(ふ)りそうだ。","Sepertinya akan hujan."],["このケーキはおいしそうだ。","Kue ini kelihatan enak."]],"n":"Pengecualian: いい → よさそう, ない → なさそう. Berbeda dengan そうだ (kabarnya) yang memakai bentuk biasa."},{"t":"～そうもない","r":"V bentuk ます (tanpa ます) + そうもない / そうにない","m":"Sepertinya tidak akan ... (kemungkinan sangat kecil).","ex":[["仕事(しごと)が多(おお)すぎて、今日(きょう)中(じゅう)には終(お)わりそうもない。","Pekerjaan terlalu banyak, sepertinya tidak akan selesai hari ini."],["この雨(あめ)はやみそうにない。","Hujan ini sepertinya tidak akan berhenti."]],"n":"Bentuk lampau: ～そうもなかった."},{"t":"～かもしれない","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + かもしれない","m":"Mungkin, bisa jadi (kemungkinan tidak terlalu pasti).","ex":[["午後(ごご)から雨(あめ)が降(ふ)るかもしれない。","Mungkin sore nanti hujan turun."],["彼(かれ)は私(わたし)の話(はなし)を誤解(ごかい)したのかもしれない。","Mungkin dia salah paham dengan ucapanku."]],"n":"Lebih lemah daripada ～に違いない. Dalam lisan sering disingkat ～かも."},{"t":"～はずがない","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + はずがない","m":"Tidak mungkin ... (penyangkalan kuat berdasarkan alasan logis).","ex":[["彼(かれ)は日本(にほん)に住(す)んだことがないから、日本語(にほんご)が上手(じょうず)なはずがない。","Dia belum pernah tinggal di Jepang, jadi tidak mungkin bahasa Jepangnya mahir."],["こんな簡単(かんたん)な問題(もんだい)を間違(まちが)えるはずがない。","Tidak mungkin salah menjawab soal semudah ini."]],"n":"Bentuk lain: ～はずはない. Mirip ～わけがない."},{"t":"～わけがない","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + わけがない","m":"Tidak mungkin ... (penyangkalan kuat, sering bernada emosional).","ex":[["まだ習(なら)っていないのだから、できるわけがない。","Belum belajar, mana mungkin bisa."],["あんなに優(やさ)しい人(ひと)が、そんなことをするわけがない。","Orang sebaik itu tidak mungkin melakukan hal seperti itu."]],"n":"Jangan tertukar dengan ～わけにはいかない (tidak bisa karena alasan) dan ～わけではない (bukan berarti)."},{"t":"～ように見(み)える","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + ように見える","m":"Terlihat seperti, tampak ...","ex":[["あの二人(ふたり)は兄弟(きょうだい)のように見(み)える。","Kedua orang itu terlihat seperti kakak beradik."],["彼(かれ)は疲(つか)れているように見(み)える。","Dia terlihat lelah."]],"n":"Berdasarkan kesan visual. Bisa juga memakai ～く見える / ～に見える."}]},{"g":"Kontras & Tambahan","items":[{"t":"～のに","r":"Bentuk biasa (Adj-na dan Nomina: 〜な) + のに","m":"Padahal, meskipun ... (hasil tidak sesuai harapan, bernuansa kecewa).","ex":[["毎日(まいにち)練習(れんしゅう)したのに、試合(しあい)に負(ま)けてしまった。","Padahal tiap hari berlatih, tetap kalah dalam pertandingan."],["春(はる)なのに、まだ雪(ゆき)が降(ふ)っている。","Padahal sudah musim semi, salju masih turun."]],"n":"Bagian belakang tidak berupa perintah atau permintaan."},{"t":"～ても／でも","r":"V て / Adj-i くて / Adj-na・Nomina で + も","m":"Meskipun, biarpun ... tetap ...","ex":[["雨(あめ)が降(ふ)っても、試合(しあい)は行(おこな)われる。","Meskipun hujan, pertandingan tetap diadakan."],["高(たか)くても、品質(ひんしつ)がいいなら買(か)いたい。","Biarpun mahal, kalau kualitasnya bagus saya ingin membeli."]],"n":"Dengan いくら / たとえ penekanannya menguat (いくら考えても = sebanyak apa pun dipikirkan)."},{"t":"～としても","r":"Bentuk biasa + としても","m":"Seandainya pun, kalaupun ... (pengandaian dengan hasil yang tetap).","ex":[["たとえ失敗(しっぱい)したとしても、後悔(こうかい)はしない。","Seandainya pun gagal, saya tidak akan menyesal."],["今(いま)から急(いそ)いだとしても、間(ま)に合(あ)わないだろう。","Kalaupun sekarang buru-buru, sepertinya tidak akan keburu."]],"n":"Sering berpasangan dengan たとえ."},{"t":"～にしても","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + にしても / にしろ","m":"Sekalipun ..., bagaimanapun ... (menerima suatu hal, tetapi ...).","ex":[["行(い)くにしても、行(い)かないにしても、連絡(れんらく)してください。","Mau pergi atau tidak, tolong kabari."],["忙(いそが)しいにしても、返事(へんじ)くらいはできるはずだ。","Sesibuk apa pun, membalas pesan seharusnya bisa."]],"n":"Pola ～にしても～にしても berarti “baik ... maupun ...”."},{"t":"～といっても","r":"Bentuk biasa + といっても","m":"Meskipun dibilang ..., sebenarnya hanya ... (membatasi kesan yang timbul).","ex":[["料理(りょうり)ができるといっても、簡単(かんたん)なものだけです。","Meski bisa memasak, hanya yang sederhana saja."],["日本(にほん)に住(す)んでいたといっても、半年(はんとし)だけだ。","Meski dibilang pernah tinggal di Jepang, hanya setengah tahun."]],"n":"Bagian belakang menjelaskan batas atau kenyataan sebenarnya."},{"t":"～だけでなく","r":"Bentuk biasa (Adj-na: 〜な, Nomina) + だけでなく、～も","m":"Tidak hanya ..., ... juga.","ex":[["この店(みせ)は味(あじ)だけでなく、値段(ねだん)も安(やす)い。","Toko ini tidak hanya enak, harganya juga murah."],["彼(かれ)は勉強(べんきょう)だけでなく、スポーツも得意(とくい)だ。","Dia tidak hanya pandai belajar, olahraga pun jago."]],"n":"Setara ～ばかりでなく, tetapi lebih netral. Bagian belakang biasanya memakai も."},{"t":"～上(うえ)に","r":"V kamus / Adj-i / Adj-na: 〜な / Nomina: 〜の + 上に","m":"Selain itu juga, lagi pula (menambah hal yang sejenis).","ex":[["この部屋(へや)は広(ひろ)い上(うえ)に、駅(えき)から近(ちか)い。","Kamar ini luas, dan dekat stasiun pula."],["今日(きょう)は風(かぜ)が強(つよ)い上(うえ)に、雨(あめ)も降(ふ)っている。","Hari ini anginnya kencang, ditambah hujan pula."]],"n":"Hal yang ditambahkan sama-sama baik atau sama-sama buruk."},{"t":"～し","r":"Bentuk biasa + し、～","m":"Selain ..., juga ... (menyebut beberapa hal atau alasan).","ex":[["このアパートは駅(えき)に近(ちか)いし、家賃(やちん)も安(やす)い。","Apartemen ini dekat stasiun, sewanya pun murah."],["今日(きょう)は疲(つか)れているし、もう帰(かえ)ります。","Hari ini capek, jadi saya pulang saja."]],"n":"Bisa juga dipakai untuk menyebut alasan dengan nada halus."}]},{"g":"Alasan, Sebab & Tujuan","items":[{"t":"～ので","r":"Bentuk biasa (Adj-na dan Nomina: 〜な) + ので","m":"Karena (alasan yang disampaikan secara objektif dan halus).","ex":[["雨(あめ)が降(ふ)っているので、今日(きょう)は出(で)かけません。","Karena hujan, hari ini saya tidak keluar."],["熱(ねつ)があるので、会社(かいしゃ)を休(やす)みました。","Karena demam, saya tidak masuk kerja."]],"n":"Lebih lembut daripada ～から. Sering dipakai untuk memberi alasan dengan sopan."},{"t":"～ために（原因(げんいん)）","r":"V / Adj-i bentuk biasa; Adj-na: 〜な; Nomina: 〜の + ため(に)","m":"Karena, akibat ... (sebab yang melahirkan suatu hasil, gaya agak formal).","ex":[["台風(たいふう)のため、電車(でんしゃ)が止(と)まった。","Karena topan, kereta berhenti."],["事故(じこ)があったために、道(みち)が込(こ)んでいる。","Karena ada kecelakaan, jalanan macet."]],"n":"Hasilnya berupa fakta, bukan keinginan atau perintah."},{"t":"～せいで","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + せいで","m":"Gara-gara ... (menyalahkan sebab atas hasil yang buruk).","ex":[["寝坊(ねぼう)したせいで、電車(でんしゃ)に乗(の)り遅(おく)れた。","Gara-gara kesiangan, saya ketinggalan kereta."],["あなたのせいで、みんなに迷惑(めいわく)がかかった。","Gara-gara kamu, semua orang jadi terganggu."]],"n":"Hasilnya selalu buruk. Untuk hasil baik pakai ～おかげで."},{"t":"～おかげで","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + おかげで","m":"Berkat ... (rasa terima kasih atas hasil yang baik).","ex":[["先生(せんせい)のおかげで、試験(しけん)に合格(ごうかく)できました。","Berkat guru, saya bisa lulus ujian."],["天気(てんき)がよかったおかげで、旅行(りょこう)は楽(たの)しかった。","Berkat cuaca bagus, perjalanannya menyenangkan."]],"n":"Hasilnya baik. Kadang dipakai sinis untuk hasil buruk."},{"t":"～せいか","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + せいか","m":"Mungkin karena ... (sebabnya hanya dugaan).","ex":[["寝不足(ねぶそく)のせいか、頭(あたま)が痛(いた)い。","Mungkin karena kurang tidur, kepalaku sakit."],["年(とし)のせいか、最近(さいきん)疲(つか)れやすい。","Mungkin karena usia, belakangan mudah lelah."]],"n":"Biasanya untuk hasil kurang baik. Untuk hasil baik dipakai ～おかげか."},{"t":"～ために（目的(もくてき)）","r":"V kamus / Nomina + の + ために","m":"Untuk, demi ... (tujuan, subjek kedua klausa sama).","ex":[["日本(にほん)で働(はたら)くために、日本語(にほんご)を勉強(べんきょう)している。","Untuk bekerja di Jepang, saya belajar bahasa Jepang."],["家族(かぞく)のために、毎日(まいにち)働(はたら)いている。","Demi keluarga, saya bekerja setiap hari."]],"n":"Subjek kedua klausa harus sama dan kata kerjanya tindakan sengaja. Kalau beda subjek, pakai ～ように."},{"t":"～ように（目的(もくてき)）","r":"V kamus / V ない / V potensial + ように","m":"Supaya, agar ... (tujuan berupa keadaan).","ex":[["忘(わす)れないように、メモしておきます。","Supaya tidak lupa, saya catat dulu."],["子供(こども)にも読(よ)めるように、漢字(かんじ)にふりがなをつけた。","Supaya anak-anak juga bisa membaca, kanjinya diberi furigana."]],"n":"Dipakai kalau subjek berbeda atau keadaan tidak bisa dikendalikan kemauan (bentuk potensial, ない)."},{"t":"～のだから","r":"Bentuk biasa (Adj-na dan Nomina: 〜な) + のだから / んだから","m":"Karena ... (kan), alasan yang dianggap sudah jelas bagi lawan bicara.","ex":[["子供(こども)なのだから、間違(まちが)えても仕方(しかた)がない。","Namanya juga anak-anak, wajar kalau salah."],["約束(やくそく)したのだから、守(まも)らなければならない。","Kan sudah janji, harus ditepati."]],"n":"Bagian belakang boleh berupa saran, perintah, atau ajakan, berbeda dengan ～ので."}]},{"g":"Syarat & Pengandaian","items":[{"t":"～ば","r":"V bentuk ば / Adj-i ければ / Adj-na・Nomina なら(ば) atau であれば","m":"Kalau, jika ... (syarat).","ex":[["安(やす)ければ、買(か)います。","Kalau murah, saya beli."],["急(いそ)げば、まだ間(ま)に合(あ)う。","Kalau buru-buru, masih keburu."]],"n":"Menekankan syarat. Juga dipakai untuk kebenaran umum (春になれば暖かくなる)."},{"t":"～たら","r":"V た / Adj-i かった / Adj-na・Nomina だった + ら","m":"Kalau, setelah, ketika ... (syarat, atau hal yang terjadi sesudahnya).","ex":[["駅(えき)に着(つ)いたら、電話(でんわ)してください。","Kalau sudah sampai stasiun, tolong telepon."],["窓(まど)を開(あ)けたら、雪(ゆき)が降(ふ)っていた。","Ketika jendela dibuka, ternyata salju turun."]],"n":"Paling fleksibel. Bagian belakang boleh berupa permintaan, kemauan, atau hal yang baru ditemukan."},{"t":"～なら","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + なら","m":"Kalau memang ..., kalau begitu ... (menanggapi topik atau informasi dari lawan bicara).","ex":[["京都(きょうと)へ行(い)くなら、秋(あき)がいいですよ。","Kalau mau ke Kyoto, musim gugur bagus."],["そんなに疲(つか)れているなら、今日(きょう)は休(やす)んだほうがいい。","Kalau memang selelah itu, hari ini sebaiknya istirahat."]],"n":"Bagian depan berupa topik atau informasi yang sudah diketahui, bukan kejadian yang akan terjadi."},{"t":"～と","r":"V kamus / V ない / Adj + だ + と","m":"Kalau ... pasti ..., begitu ... (hubungan otomatis atau kebiasaan).","ex":[["このボタンを押(お)すと、ドアが開(あ)きます。","Kalau tombol ini ditekan, pintu terbuka."],["春(はる)になると、昼(ひる)が長(なが)くなる。","Kalau musim semi tiba, siang jadi lebih panjang."]],"n":"Bagian belakang bukan kemauan, perintah, atau ajakan."},{"t":"～場合(ばあい)は","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + 場合は","m":"Dalam hal ..., kalau terjadi ... (situasi tertentu).","ex":[["分(わ)からない場合(ばあい)は、先生(せんせい)に聞(き)いてください。","Kalau ada yang tidak paham, tanyakan ke guru."],["雨(あめ)の場合(ばあい)は、試合(しあい)は中止(ちゅうし)になります。","Jika hujan, pertandingan dibatalkan."]],"n":"Dipakai untuk aturan, petunjuk, atau situasi yang mungkin terjadi."},{"t":"～ようなら","r":"V kamus / V ない / Adj-i + ようなら","m":"Kalau sampai ..., kalau tampaknya ... (syarat dari kondisi yang diperkirakan).","ex":[["具合(ぐあい)が悪(わる)いようなら、無理(むり)をしないで休(やす)んでください。","Kalau kondisimu tampak buruk, jangan memaksa, istirahatlah."],["明日(あした)も雨(あめ)が降(ふ)るようなら、出発(しゅっぱつ)を遅(おく)らせよう。","Kalau besok hujan lagi, kita undur keberangkatan."]],"n":"Syaratnya berupa situasi yang tidak diharapkan."},{"t":"～ば／～たら～のに","r":"V ば / V たら (Adj-i: ければ, Adj-na・Nomina: なら) + 〜のに","m":"Seandainya ..., pasti ... (pengandaian yang bertentangan dengan kenyataan).","ex":[["もっと早(はや)く起(お)きていれば、電車(でんしゃ)に間(ま)に合(あ)ったのに。","Seandainya bangun lebih pagi, pasti keburu naik kereta."],["お金(かね)があったら、世界(せかい)一周(いっしゅう)ができるのに。","Seandainya punya uang, aku bisa keliling dunia."]],"n":"Kenyataannya sebaliknya. Sering bernuansa menyesal atau berandai-andai."},{"t":"～ばよかった","r":"V ば + よかった / V なければ + よかった","m":"Seharusnya tadi ... (penyesalan atas hal yang sudah lewat).","ex":[["もっと勉強(べんきょう)しておけばよかった。","Menyesal tidak belajar lebih banyak."],["あんなことを言(い)わなければよかった。","Seharusnya tidak kukatakan hal seperti itu."]],"n":"Hal yang sudah terjadi tidak bisa diubah, jadi nadanya penyesalan."}]},{"g":"Waktu & Urutan","items":[{"t":"～間(あいだ)／～間(あいだ)に","r":"V ている / Adj / Nomina + の + 間 (に)","m":"間: selama ... (berlangsung terus). 間に: selagi ... (terjadi sekali dalam rentang itu).","ex":[["留守(るす)の間(あいだ)、犬(いぬ)の世話(せわ)をお願(ねが)いします。","Selama saya tidak di rumah, tolong jaga anjing kami."],["子供(こども)が寝(ね)ている間(あいだ)に、買(か)い物(もの)に行(い)ってきた。","Selagi anak tidur, saya pergi belanja."]],"n":"間 diikuti keadaan yang berlangsung terus. 間に diikuti kejadian sekali."},{"t":"～ところだ","r":"V kamus / V ている / V た + ところだ","m":"Baru akan, sedang, baru saja ... (tahap dari suatu tindakan).","ex":[["今(いま)から出(で)かけるところです。","Saya baru mau berangkat."],["ちょうど夕食(ゆうしょく)を食(た)べているところだ。","Saya persis sedang makan malam."]],"n":"Bentuk た (～たところだ) berarti baru saja selesai, dengan jarak waktu yang sangat dekat."},{"t":"～たばかり","r":"V た + ばかり","m":"Baru saja ... (terasa belum lama menurut pembicara).","ex":[["この車(くるま)は買(か)ったばかりなのに、もう故障(こしょう)した。","Mobil ini baru dibeli, tetapi sudah rusak."],["日本(にほん)に来(き)たばかりで、まだ友達(ともだち)がいません。","Baru sampai di Jepang, jadi belum punya teman."]],"n":"Jarak waktunya menurut perasaan pembicara, jadi secara objektif bisa cukup lama."},{"t":"～までに","r":"Nomina (waktu) / V kamus + までに","m":"Paling lambat ... (batas akhir waktu).","ex":[["レポートは金曜日(きんようび)までに出(だ)してください。","Tolong kumpulkan laporan paling lambat hari Jumat."],["電車(でんしゃ)が出(で)るまでに、駅(えき)に着(つ)かなければならない。","Harus tiba di stasiun sebelum kereta berangkat."]],"n":"まで: terus-menerus sampai. までに: batas akhir untuk satu tindakan."},{"t":"～たびに","r":"V kamus / Nomina + の + たびに","m":"Setiap kali ... (hal yang sama selalu terjadi).","ex":[["この写真(しゃしん)を見(み)るたびに、あの夏(なつ)を思(おも)い出(だ)す。","Setiap kali melihat foto ini, aku teringat musim panas itu."],["彼(かれ)は旅行(りょこう)のたびに、お土産(みやげ)を買(か)ってきてくれる。","Setiap bepergian, dia membawakan oleh-oleh."]],"n":"Menekankan kejadian yang berulang."},{"t":"～ごとに","r":"Nomina / V kamus + ごとに","m":"Setiap ..., tiap ... (interval atau satuan yang teratur).","ex":[["この薬(くすり)は六時間(ろくじかん)ごとに飲(の)んでください。","Obat ini diminum setiap enam jam."],["駅(えき)ごとに、特徴(とくちょう)のあるお土産(みやげ)がある。","Di tiap stasiun ada oleh-oleh khas."]],"n":"Bisa dipakai untuk waktu, jarak, atau satuan lain (一年ごと, 三メートルごと)."},{"t":"～ながら","r":"V bentuk ます (tanpa ます) + ながら","m":"Sambil ... (dua tindakan berlangsung bersamaan).","ex":[["音楽(おんがく)を聞(き)きながら、勉強(べんきょう)する。","Belajar sambil mendengarkan musik."],["歩(ある)きながら携帯(けいたい)を見(み)るのは危(あぶ)ない。","Berjalan sambil melihat ponsel itu berbahaya."]],"n":"Tindakan utama ada di bagian belakang. Subjek kedua tindakan harus sama."},{"t":"～末(すえ)に","r":"V た / Nomina の + 末に","m":"Setelah lama ..., akhirnya ... (hasil setelah proses panjang).","ex":[["何度(なんど)も話(はな)し合(あ)った末(すえ)に、結論(けつろん)が出(で)た。","Setelah berkali-kali berdiskusi, akhirnya diperoleh kesimpulan."],["長(なが)い交渉(こうしょう)の末(すえ)、契約(けいやく)が決(き)まった。","Setelah negosiasi panjang, kontrak akhirnya disepakati."]],"n":"Menekankan proses yang panjang. Hasilnya berupa keputusan atau kejadian penting."}]},{"g":"Perubahan & Kebiasaan","items":[{"t":"～ようになる","r":"V kamus / V ない + ようになる","m":"Menjadi bisa ..., jadi mulai ... (kemampuan atau kebiasaan berubah).","ex":[["毎日(まいにち)練習(れんしゅう)して、やっと泳(およ)げるようになった。","Berlatih tiap hari, akhirnya jadi bisa berenang."],["最近(さいきん)、子供(こども)が野菜(やさい)を食(た)べるようになった。","Belakangan anak mulai mau makan sayur."]],"n":"Perubahan bertahap dari keadaan sebelumnya. Kebalikannya: ～なくなる."},{"t":"～なくなる","r":"V bentuk ない (ない → なくなる)","m":"Menjadi tidak ... lagi (sesuatu yang dulu ada sekarang tidak).","ex":[["年(とし)をとって、遠(とお)くが見(み)えなくなった。","Karena bertambah usia, jadi tidak bisa melihat jauh."],["最近(さいきん)、忙(いそが)しくて友達(ともだち)と会(あ)わなくなった。","Belakangan sibuk, jadi tidak bertemu teman lagi."]],"n":"Kebalikan ～ようになる. Sering dipakai dengan bentuk potensial (読めなくなった)."},{"t":"～ことにする","r":"V kamus / V ない + ことにする","m":"Memutuskan untuk ... (keputusan sendiri).","ex":[["健康(けんこう)のために、毎朝(まいあさ)走(はし)ることにした。","Demi kesehatan, saya memutuskan lari tiap pagi."],["来月(らいげつ)の旅行(りょこう)は行(い)かないことにした。","Saya putuskan tidak ikut perjalanan bulan depan."]],"n":"Pembicara sendiri yang memutuskan. Keputusan dari luar: ～ことになる."},{"t":"～ことになる","r":"V kamus / V ない + ことになる","m":"Diputuskan bahwa ..., jadinya ... (keputusan di luar kehendak sendiri atau kesimpulan).","ex":[["来月(らいげつ)から大阪(おおさか)で働(はたら)くことになった。","Mulai bulan depan, diputuskan saya bekerja di Osaka."],["この計画(けいかく)は中止(ちゅうし)することになりました。","Rencana ini diputuskan dibatalkan."]],"n":"Sering dipakai untuk menyampaikan keputusan pihak lain atau organisasi dengan halus."},{"t":"～ことにしている","r":"V kamus / V ない + ことにしている","m":"Sudah menjadi kebiasaan atau prinsip untuk ...","ex":[["私(わたし)は毎晩(まいばん)十二時(じゅうにじ)前(まえ)に寝(ね)ることにしている。","Saya membiasakan tidur sebelum jam dua belas tiap malam."],["健康(けんこう)のために、甘(あま)いものは食(た)べないことにしている。","Demi kesehatan, saya berprinsip tidak makan yang manis."]],"n":"Kebiasaan yang berasal dari keputusan sendiri."},{"t":"～ようにする","r":"V kamus / V ない + ようにする","m":"Berusaha agar ..., membiasakan ... (upaya yang terus dilakukan).","ex":[["毎日(まいにち)野菜(やさい)を食(た)べるようにしている。","Saya berusaha makan sayur setiap hari."],["遅刻(ちこく)しないようにします。","Saya akan berusaha tidak terlambat."]],"n":"Menekankan upaya, bukan hasil. Bandingkan ～ことにする yang berarti keputusan."},{"t":"～てくる／～ていく（変化(へんか)）","r":"V て + くる / いく","m":"Semakin ... (perubahan sampai sekarang atau menuju masa depan).","ex":[["最近(さいきん)、日本語(にほんご)の勉強(べんきょう)が楽(たの)しくなってきた。","Belakangan belajar bahasa Jepang jadi makin menyenangkan."],["これから、この町(まち)の人口(じんこう)は減(へ)っていくだろう。","Ke depan, penduduk kota ini mungkin akan terus berkurang."]],"n":"～てくる: perubahan sampai saat ini. ～ていく: perubahan ke depan."},{"t":"～ことがある","r":"V kamus / V ない + ことがある","m":"Kadang-kadang ... (hal yang tidak terlalu sering terjadi).","ex":[["休日(きゅうじつ)は、昼(ひる)まで寝(ね)ていることがある。","Pada hari libur, kadang saya tidur sampai siang."],["このバスは、遅(おく)れることがある。","Bus ini kadang terlambat."]],"n":"Bentuk た (～たことがある) berarti pernah mengalami."}]},{"g":"Topik & Sudut Pandang","items":[{"t":"～について","r":"Nomina + について","m":"Mengenai, tentang ...","ex":[["この問題(もんだい)について、どう思(おも)いますか。","Bagaimana pendapat Anda mengenai masalah ini?"],["旅行(りょこう)の計画(けいかく)について、友達(ともだち)と相談(そうだん)した。","Saya berunding dengan teman soal rencana perjalanan."]],"n":"Lebih umum dan santai daripada ～に関して. Bentuk penjelas nomina: ～についての + Nomina."},{"t":"～として","r":"Nomina + として","m":"Sebagai ... (kedudukan, peran, atau kualifikasi).","ex":[["彼(かれ)は医者(いしゃ)として、多(おお)くの人(ひと)を助(たす)けた。","Sebagai dokter, dia menolong banyak orang."],["留学生(りゅうがくせい)として、日本(にほん)に来(き)ました。","Saya datang ke Jepang sebagai pelajar asing."]],"n":"Bentuk penjelas nomina: ～としての + Nomina."},{"t":"～によると／～によれば","r":"Nomina + によると / によれば","m":"Menurut ... (sumber informasi).","ex":[["ニュースによると、昨夜(さくや)大(おお)きな地震(じしん)があったそうだ。","Menurut berita, semalam ada gempa besar."],["友達(ともだち)の話(はなし)によれば、あの店(みせ)は閉(し)まったらしい。","Menurut cerita teman, toko itu sudah tutup."]],"n":"Bagian belakang berupa kabar (そうだ, らしい, ということだ), bukan pendapat sendiri."},{"t":"～というと／～といえば","r":"Nomina + というと / といえば","m":"Kalau bicara soal ..., kalau menyebut ... (teringat hal yang berkaitan).","ex":[["日本(にほん)の食(た)べ物(もの)といえば、すしが有名(ゆうめい)だ。","Kalau bicara makanan Jepang, sushi terkenal."],["夏(なつ)といえば、花火(はなび)を思(おも)い出(だ)す。","Kalau bicara musim panas, aku teringat kembang api."]],"n":"Dipakai untuk mengaitkan topik dengan hal yang langsung teringat."},{"t":"～というのは","r":"Nomina / Bentuk biasa + というのは","m":"Yang dimaksud dengan ... (definisi atau penjelasan).","ex":[["「エコ」というのは、環境(かんきょう)にやさしいという意味(いみ)だ。","“Eko” maksudnya ramah lingkungan."],["約束(やくそく)というのは、守(まも)るためにするものだ。","Yang namanya janji itu dibuat untuk ditepati."]],"n":"Dalam lisan menjadi ～っていうのは atau ～って."},{"t":"～という～","r":"Nomina + という + Nomina","m":"(Nomina) yang bernama ... (memperkenalkan sesuatu yang belum dikenal).","ex":[["山田(やまだ)さんという人(ひと)から電話(でんわ)があった。","Ada telepon dari orang bernama Yamada."],["「雪国(ゆきぐに)」という小説(しょうせつ)を読(よ)んだことがありますか。","Pernahkah Anda membaca novel berjudul “Yukiguni”?"]],"n":"Dipakai untuk nama atau hal yang kurang dikenal oleh pembicara atau lawan bicara."},{"t":"～とともに","r":"Nomina / V kamus + とともに","m":"Bersama dengan ...; seiring dengan ... (dua hal terjadi atau berubah bersamaan).","ex":[["家族(かぞく)とともに、新(あたら)しい生活(せいかつ)を始(はじ)める。","Memulai hidup baru bersama keluarga."],["年(とし)を取(と)るとともに、体力(たいりょく)が落(お)ちてきた。","Seiring bertambah usia, stamina menurun."]],"n":"Dipakai untuk arti “bersama” dan “seiring”. Gayanya agak formal."},{"t":"～にしたがって","r":"Nomina / V kamus + にしたがって","m":"Seiring dengan ...; mengikuti ... (perubahan bertahap, atau menaati aturan).","ex":[["高(たか)い山(やま)に登(のぼ)るにしたがって、空気(くうき)がうすくなる。","Semakin naik gunung yang tinggi, udara makin tipis."],["係員(かかりいん)の指示(しじ)にしたがって、避難(ひなん)してください。","Tolong mengungsi sesuai petunjuk petugas."]],"n":"Dua arti: perubahan bertahap dan mengikuti. Arti pertama mirip ～につれて."}]},{"g":"Perbandingan & Tingkat","items":[{"t":"～より～のほうが","r":"Nomina + より + Nomina + のほうが + Adj / V","m":"Lebih ... daripada ... (membandingkan dua hal).","ex":[["バスより電車(でんしゃ)のほうが速(はや)い。","Kereta lebih cepat daripada bus."],["読(よ)むより、聞(き)くほうが分(わ)かりやすい。","Mendengarkan lebih mudah dipahami daripada membaca."]],"n":"Urutan dua bagiannya boleh ditukar menjadi ～のほうが～より."},{"t":"～の中(なか)で～が一番(いちばん)","r":"Nomina (kelompok) + の中で + Nomina + が一番 + Adj / V","m":"Di antara ..., yang paling ...","ex":[["果物(くだもの)の中(なか)で、りんごが一番(いちばん)好(す)きです。","Di antara buah-buahan, saya paling suka apel."],["クラスの中(なか)で、田中(たなか)さんが一番(いちばん)背(せ)が高(たか)い。","Di kelas, Tanaka yang paling tinggi."]],"n":"Kalau hanya membandingkan dua hal, pakai pola ～のほうが."},{"t":"～くらい／～ぐらい","r":"Nomina (jumlah) / V kamus / Adj + くらい","m":"Sekitar ... (perkiraan); sampai ... (tingkat).","ex":[["駅(えき)まで歩(ある)いて十分(じゅっぷん)ぐらいかかります。","Berjalan ke stasiun memakan waktu sekitar sepuluh menit."],["おなかが痛(いた)くなるくらい笑(わら)った。","Tertawa sampai perut sakit."]],"n":"Juga dipakai untuk menganggap sesuatu sepele (これくらい自分でできる)."},{"t":"～と同(おな)じくらい","r":"Nomina + と同じくらい + Adj","m":"Sama ... dengan ... (tingkat yang setara).","ex":[["この店(みせ)のラーメンは、あの店(みせ)と同(おな)じくらいおいしい。","Ramen di toko ini sama enaknya dengan toko itu."],["弟(おとうと)は私(わたし)と同(おな)じくらいの身長(しんちょう)だ。","Tinggi badan adikku hampir sama dengan aku."]],"n":"Bisa juga ～と同じぐらい atau ～と同じ + Nomina."},{"t":"～ずつ","r":"Jumlah + ずつ","m":"Masing-masing ..., sedikit demi sedikit (jumlah yang sama untuk tiap bagian).","ex":[["みんなにお菓子(かし)を三(みっ)つずつ配(くば)った。","Kue dibagikan, tiap orang tiga buah."],["毎日(まいにち)少(すこ)しずつ、漢字(かんじ)を覚(おぼ)える。","Menghafal kanji sedikit demi sedikit tiap hari."]],"n":"Menunjukkan jumlah per satuan atau proses yang bertahap."},{"t":"～さ／～み","r":"Adj-i tanpa い / Adj-na + さ (み)","m":"Mengubah kata sifat menjadi kata benda (tingkat atau sifat).","ex":[["この山(やま)の高(たか)さは三千(さんぜん)メートルだ。","Ketinggian gunung ini 3.000 meter."],["彼(かれ)の優(やさ)しさに、いつも助(たす)けられている。","Aku selalu tertolong oleh kebaikannya."]],"n":"さ untuk tingkat atau sifat yang bisa diukur. み untuk kesan yang dirasakan (痛み, 楽しみ)."},{"t":"～すぎる","r":"V bentuk ます (tanpa ます) / Adj-i tanpa い / Adj-na + すぎる","m":"Terlalu ... (melebihi batas wajar).","ex":[["昨日(きのう)は食(た)べすぎて、おなかが痛(いた)い。","Kemarin makan terlalu banyak, perutku sakit."],["この問題(もんだい)は難(むずか)しすぎて、分(わ)からない。","Soal ini terlalu sulit, saya tidak paham."]],"n":"Biasanya bernuansa kurang baik karena melampaui batas yang pantas."},{"t":"～だけ（できる範囲(はんい)）","r":"V kamus / V potensial + だけ + V","m":"Sebisa mungkin, sebanyak yang ... (sampai batas kemampuan atau keinginan).","ex":[["食(た)べられるだけ食(た)べていいですよ。","Makanlah sebanyak yang kamu bisa."],["できるだけ早(はや)く返事(へんじ)をください。","Tolong balas secepat mungkin."]],"n":"Ungkapan umum: できるだけ, 好きなだけ, 欲しいだけ."}]},{"g":"Cara & Keadaan","items":[{"t":"～たまま／～のまま","r":"V た / V ない / Adj / Nomina の + まま","m":"Tetap dalam keadaan ... (keadaan berlanjut tanpa berubah).","ex":[["窓(まど)を開(あ)けたまま、寝(ね)てしまった。","Aku ketiduran dengan jendela tetap terbuka."],["この町(まち)は、昔(むかし)のままで変(か)わっていない。","Kota ini masih seperti dulu, tidak berubah."]],"n":"Bagian belakang berupa tindakan atau keadaan lain yang terjadi selagi keadaan itu bertahan."},{"t":"～ないで／～ずに","r":"V ない + で / V ない (tanpa ない) + ずに (する → せずに)","m":"Tanpa melakukan ...","ex":[["朝(あさ)ご飯(はん)を食(た)べないで、学校(がっこう)へ行(い)った。","Pergi ke sekolah tanpa sarapan."],["辞書(じしょ)を使(つか)わずに、日本語(にほんご)の本(ほん)を読(よ)んだ。","Membaca buku bahasa Jepang tanpa memakai kamus."]],"n":"～ずに lebih bernuansa tulisan daripada ～ないで."},{"t":"～とおり(に)","r":"V kamus / V た / Nomina の + とおり(に)","m":"Sesuai dengan ..., seperti ... (mengikuti sesuatu).","ex":[["先生(せんせい)に言(い)われたとおりに、やってみた。","Aku mencobanya persis seperti kata guru."],["私(わたし)が思(おも)ったとおり、彼(かれ)は来(こ)なかった。","Seperti dugaanku, dia tidak datang."]],"n":"Nomina bisa langsung ditempel ～どおり (予定どおり)."},{"t":"～ふうに","r":"V / Adj bentuk biasa / Nomina の + ふうに","m":"Dengan cara ..., seperti ... (cara atau gaya).","ex":[["どういうふうに説明(せつめい)したらいいですか。","Bagaimana sebaiknya saya menjelaskannya?"],["彼(かれ)はいつも、何(なに)も知(し)らないふうに話(はな)す。","Dia selalu bicara seolah tidak tahu apa-apa."]],"n":"Sering muncul dalam bentuk こういうふうに / そういうふうに / どういうふうに."},{"t":"～やすい／～にくい","r":"V bentuk ます (tanpa ます) + やすい / にくい","m":"Mudah ..., sulit ... (karena sifat benda atau keadaan).","ex":[["このペンは書(か)きやすい。","Pena ini enak dipakai menulis."],["この道(みち)は暗(くら)くて、歩(ある)きにくい。","Jalan ini gelap, sulit dilalui."]],"n":"Menilai sifat benda atau keadaan. ～づらい lebih ke perasaan yang tidak enak."},{"t":"～方(かた)","r":"V bentuk ます (tanpa ます) + 方","m":"Cara ... (cara melakukan sesuatu).","ex":[["この漢字(かんじ)の読(よ)み方(かた)を教(おし)えてください。","Tolong ajari saya cara membaca kanji ini."],["彼(かれ)の話(はな)し方(かた)は、とても分(わ)かりやすい。","Cara bicaranya sangat mudah dipahami."]],"n":"Mengubah kata kerja menjadi kata benda. Untuk する: 勉強のしかた."},{"t":"～たて","r":"V bentuk ます (tanpa ます) + たて","m":"Baru saja ... (baru selesai dibuat atau dilakukan).","ex":[["焼(や)きたてのパンは、本当(ほんとう)においしい。","Roti yang baru dipanggang itu enak sekali."],["できたてのスープは熱(あつ)いから、気(き)をつけて。","Sup yang baru jadi itu panas, hati-hati."]],"n":"Terbatas pada kata kerja tertentu (焼きたて, できたて, 洗いたて)."},{"t":"～ついでに","r":"V kamus / V た / Nomina の + ついでに","m":"Sekalian, mumpung ... (dua tindakan dilakukan sekaligus).","ex":[["出張(しゅっちょう)のついでに、友達(ともだち)に会(あ)ってきた。","Sekalian dinas luar, aku bertemu teman."],["スーパーに行(い)くついでに、牛乳(ぎゅうにゅう)も買(か)ってきてくれる？","Sekalian ke supermarket, bisa tolong belikan susu juga?"]],"n":"Tindakan utama disebut lebih dulu, tindakan kedua hanya tambahan."}]},{"g":"Aspek Tindakan","items":[{"t":"～てしまう","r":"V て + しまう (lisan: ちゃう / じゃう)","m":"(a) Selesai sepenuhnya; (b) terjadi tanpa sengaja atau disesali.","ex":[["宿題(しゅくだい)を全部(ぜんぶ)やってしまった。","Pekerjaan rumah sudah kuselesaikan semuanya."],["大事(だいじ)な書類(しょるい)をなくしてしまった。","Aku menghilangkan dokumen penting."]],"n":"Singkatan lisan: 食べちゃった, 飲んじゃった."},{"t":"～ておく","r":"V て + おく","m":"Melakukan lebih dulu sebagai persiapan; membiarkan dalam keadaan tertentu.","ex":[["旅行(りょこう)の前(まえ)に、ホテルを予約(よやく)しておく。","Sebelum bepergian, memesan hotel dulu."],["窓(まど)は開(あ)けておいてください。","Tolong biarkan jendelanya terbuka."]],"n":"Lisan: ～とく (しておく → しとく)."},{"t":"～てある","r":"V (transitif) て + ある","m":"Sudah dilakukan dan hasilnya masih ada (ada yang sengaja melakukannya).","ex":[["机(つくえ)の上(うえ)に、メモが置(お)いてある。","Di atas meja ada catatan yang sengaja diletakkan."],["窓(まど)は閉(し)めてある。","Jendelanya sudah ditutup."]],"n":"Memakai kata kerja transitif. Kata kerja intransitif memakai ～ている (窓が開いている)."},{"t":"～ている（結果(けっか)の状態(じょうたい)）","r":"V (intransitif, perubahan keadaan) て + いる","m":"Keadaan sebagai hasil dari suatu perubahan.","ex":[["電気(でんき)がついている。","Lampunya menyala."],["財布(さいふ)が落(お)ちている。","Dompetnya tergeletak (terjatuh)."]],"n":"Berbeda dengan ～ている yang berarti sedang berlangsung (食べている)."},{"t":"～てみる","r":"V て + みる","m":"Mencoba melakukan ... (untuk mengetahui hasilnya).","ex":[["この料理(りょうり)、一度(いちど)作(つく)ってみたい。","Masakan ini, ingin sekali kucoba buat."],["このシャツを着(き)てみたら、少(すこ)し大(おお)きかった。","Setelah kucoba pakai, kemeja ini sedikit kebesaran."]],"n":"Bentuk permintaan: ～てみてください."},{"t":"～始(はじ)める／～出(だ)す","r":"V bentuk ます (tanpa ます) + はじめる / だす","m":"Mulai ...","ex":[["雨(あめ)が降(ふ)り始(はじ)めたので、傘(かさ)をさした。","Hujan mulai turun, jadi aku membuka payung."],["赤(あか)ちゃんが急(きゅう)に泣(な)き出(だ)した。","Bayi itu tiba-tiba menangis."]],"n":"～だす menekankan awal yang mendadak. Tidak dipakai untuk perintah atau ajakan."},{"t":"～続(つづ)ける／～終(お)わる","r":"V bentuk ます (tanpa ます) + つづける / おわる","m":"Terus ...; selesai ...","ex":[["彼(かれ)は三時間(さんじかん)も話(はな)し続(つづ)けた。","Dia terus berbicara sampai tiga jam."],["この本(ほん)は、もう読(よ)み終(お)わりました。","Buku ini sudah selesai kubaca."]],"n":"～終わる hanya untuk tindakan yang punya titik selesai."},{"t":"～そうになる","r":"V bentuk ます (tanpa ます) + そうになる","m":"Hampir saja ... (hampir terjadi, tetapi tidak jadi).","ex":[["階段(かいだん)で転(ころ)びそうになった。","Hampir saja terjatuh di tangga."],["電車(でんしゃ)の中(なか)で、寝(ね)てしまいそうになった。","Di kereta, aku hampir saja tertidur."]],"n":"Kejadiannya hampir terjadi, tetapi tidak sampai terjadi."}]},{"g":"Kemampuan, Keharusan & Larangan","items":[{"t":"～ことができる","r":"V kamus + ことができる","m":"Bisa ... (kemampuan atau kemungkinan).","ex":[["私(わたし)は日本語(にほんご)で自己紹介(じこしょうかい)をすることができる。","Saya bisa memperkenalkan diri dalam bahasa Jepang."],["この図書館(としょかん)では、本(ほん)を十冊(じゅっさつ)まで借(か)りることができる。","Di perpustakaan ini, kita bisa meminjam sampai sepuluh buku."]],"n":"Lebih formal daripada bentuk potensial. Juga dipakai untuk menyatakan boleh atau tidak menurut aturan."},{"t":"～られる／～れる（可能(かのう)）","r":"Gol.1: bentuk え + る (書く → 書ける); Gol.2: ～られる (食べる → 食べられる); する → できる; くる → こられる","m":"Bisa ... (bentuk potensial).","ex":[["朝(あさ)は六時(ろくじ)に起(お)きられます。","Pagi hari saya bisa bangun jam enam."],["この漢字(かんじ)は、まだ読(よ)めません。","Kanji ini belum bisa saya baca."]],"n":"Objek biasanya memakai が (日本語が話せる). Dalam lisan, bentuk ら抜き (食べれる) sering terdengar."},{"t":"～てもいい／～てもかまわない","r":"V て + もいい / もかまわない","m":"Boleh ... (izin).","ex":[["ここで電話(でんわ)をしてもいいですか。","Bolehkah saya menelepon di sini?"],["宿題(しゅくだい)は明日(あした)出(だ)してもかまいません。","PR boleh dikumpulkan besok."]],"n":"～てもかまわない terdengar lebih longgar, seperti “tidak masalah”."},{"t":"～なければならない／～なくてはいけない","r":"V bentuk ない tanpa い + ければならない / くてはいけない","m":"Harus ... (kewajiban).","ex":[["明日(あした)は早(はや)く起(お)きなければならない。","Besok harus bangun pagi."],["薬(くすり)は、毎日(まいにち)飲(の)まなくてはいけません。","Obat ini harus diminum tiap hari."]],"n":"Lisan: ～なきゃ / ～なくちゃ. ～なければならない lebih bernuansa tulisan."},{"t":"～なくてもいい","r":"V bentuk ない tanpa い + くてもいい","m":"Tidak perlu ..., tidak usah ...","ex":[["今日(きょう)は、スーツを着(き)なくてもいいです。","Hari ini tidak perlu memakai jas."],["明日(あした)は学校(がっこう)に来(こ)なくてもいいですよ。","Besok tidak usah datang ke sekolah."]],"n":"Bentuk lain: ～なくてもかまわない, ～なくてもよい."},{"t":"～てはいけない","r":"V て + はいけない / はならない","m":"Tidak boleh ... (larangan).","ex":[["図書館(としょかん)で大(おお)きな声(こえ)で話(はな)してはいけません。","Dilarang berbicara keras di perpustakaan."],["この部屋(へや)に入(はい)ってはならない。","Dilarang masuk ke ruangan ini."]],"n":"～てはならない lebih kaku dan dipakai untuk aturan. Lisan: ～ちゃだめ."},{"t":"～たほうがいい／～ないほうがいい","r":"V た + ほうがいい / V ない + ほうがいい","m":"Sebaiknya ... / sebaiknya tidak ...","ex":[["熱(ねつ)があるなら、早(はや)く病院(びょういん)へ行(い)ったほうがいい。","Kalau demam, sebaiknya cepat ke rumah sakit."],["夜(よる)は、コーヒーを飲(の)まないほうがいいですよ。","Malam hari sebaiknya tidak minum kopi."]],"n":"Untuk saran umum boleh memakai bentuk kamus (毎日運動するほうがいい). Kurang cocok untuk menyarankan atasan secara langsung."},{"t":"～べきだ","r":"V kamus + べきだ (する → するべき／すべき)","m":"Seharusnya ... (kewajiban atau nasihat moral).","ex":[["困(こま)っている人(ひと)がいたら、助(たす)けるべきだ。","Kalau ada orang yang kesulitan, seharusnya kita menolong."],["他人(たにん)の失敗(しっぱい)を、笑(わら)うべきではない。","Tidak seharusnya menertawakan kegagalan orang lain."]],"n":"Negatif: ～べきではない. Pendapat yang cukup tegas, hati-hati dipakai pada atasan."}]},{"g":"Niat, Rencana & Perasaan","items":[{"t":"～つもりだ","r":"V kamus / V ない + つもりだ","m":"Berniat ..., bermaksud ...","ex":[["来年(らいねん)、日本(にほん)へ留学(りゅうがく)するつもりだ。","Tahun depan saya berniat belajar ke Jepang."],["今日(きょう)は、お酒(さけ)を飲(の)まないつもりです。","Hari ini saya berniat tidak minum alkohol."]],"n":"Bentuk た (～たつもり) berarti merasa sudah ... padahal kenyataannya belum."},{"t":"～予定(よてい)だ","r":"V kamus / Nomina の + 予定だ","m":"Rencananya ... (jadwal yang sudah ditetapkan).","ex":[["会議(かいぎ)は三時(さんじ)に始(はじ)まる予定(よてい)だ。","Rapat rencananya dimulai jam tiga."],["来週(らいしゅう)、家族(かぞく)で京都(きょうと)へ行(い)く予定(よてい)です。","Minggu depan, kami sekeluarga berencana ke Kyoto."]],"n":"Lebih pasti daripada ～つもり karena sudah terjadwal."},{"t":"～(よ)うと思(おも)う","r":"V bentuk volisional + と思う / と思っている","m":"Aku berpikir akan ... (niat yang baru terpikir atau sedang direncanakan).","ex":[["夏休(なつやす)みに、アルバイトを始(はじ)めようと思(おも)っています。","Saat libur musim panas, saya berpikir mau mulai kerja paruh waktu."],["今夜(こんや)は、早(はや)く寝(ね)ようと思(おも)う。","Malam ini aku mau tidur cepat."]],"n":"～と思っている menunjukkan niat yang sudah lama dipikirkan."},{"t":"～(よ)うとする","r":"V bentuk volisional + とする","m":"Berusaha akan ...; tepat akan ... (mencoba, atau saat hampir terjadi).","ex":[["家(いえ)を出(で)ようとしたとき、電話(でんわ)が鳴(な)った。","Tepat saat hendak keluar rumah, telepon berdering."],["彼(かれ)は、その問題(もんだい)を一人(ひとり)で解決(かいけつ)しようとしている。","Dia berusaha menyelesaikan masalah itu sendirian."]],"n":"Bisa berarti usaha atau saat tepat akan melakukan sesuatu."},{"t":"～たがる","r":"V bentuk ます (tanpa ます) + たがる / たがっている","m":"Ingin ... (keinginan orang ketiga yang tampak dari luar).","ex":[["弟(おとうと)は、新(あたら)しいゲームを買(か)いたがっている。","Adikku ingin membeli game baru."],["子供(こども)は何(なん)でも自分(じぶん)でやりたがる。","Anak-anak ingin melakukan apa pun sendiri."]],"n":"～たい dipakai untuk keinginan sendiri atau bertanya ke lawan bicara; ～たがる untuk orang ketiga."},{"t":"～てほしい","r":"V て + ほしい","m":"Ingin (orang lain) ...; berharap ... (permintaan atau harapan kepada orang lain).","ex":[["もう少(すこ)し静(しず)かにしてほしい。","Aku ingin kamu sedikit lebih tenang."],["母(はは)には、いつまでも元気(げんき)でいてほしい。","Aku ingin ibu selalu sehat."]],"n":"Negatif: ～ないでほしい (tolong jangan)."},{"t":"～ものだ","r":"V kamus / Adj-i + ものだ","m":"Memang sewajarnya; betapa ...; dulu sering (～たものだ).","ex":[["子供(こども)は、よく転(ころ)ぶものだ。","Anak-anak memang sering terjatuh."],["小(ちい)さいころ、よく川(かわ)で遊(あそ)んだものだ。","Waktu kecil, aku dulu sering bermain di sungai."]],"n":"Artinya bergantung konteks: kebenaran umum, kenangan, atau rasa kagum."},{"t":"～ことだ","r":"V kamus / V ない + ことだ","m":"Sebaiknya ... (saran dari yang lebih berpengalaman).","ex":[["試験(しけん)に合格(ごうかく)したいなら、毎日(まいにち)少(すこ)しずつ勉強(べんきょう)することだ。","Kalau mau lulus ujian, sebaiknya belajar sedikit demi sedikit tiap hari."],["疲(つか)れたときは、無理(むり)をしないで休(やす)むことだ。","Kalau lelah, sebaiknya jangan memaksa dan beristirahatlah."]],"n":"Dipakai oleh orang yang lebih berpengalaman atau lebih tua. Kurang pas untuk atasan."}]},{"g":"Kutipan, Kabar & Penegasan","items":[{"t":"～そうだ（伝聞(でんぶん)）","r":"Bentuk biasa + そうだ","m":"Katanya, kabarnya (menyampaikan informasi yang didengar).","ex":[["田中(たなか)さんは来月(らいげつ)、会社(かいしゃ)をやめるそうだ。","Katanya Tanaka akan berhenti kerja bulan depan."],["あのレストランは、とても人気(にんき)があるそうです。","Katanya restoran itu sangat populer."]],"n":"Berbeda dengan ～そうだ (tampak) yang menempel pada bentuk ます atau akar kata sifat."},{"t":"～らしい","r":"Bentuk biasa (Adj-na dan Nomina tanpa だ) + らしい","m":"Katanya, tampaknya (dugaan dari informasi atau tanda-tanda).","ex":[["隣(となり)の人(ひと)は、来週(らいしゅう)旅行(りょこう)に行(い)くらしい。","Katanya tetangga akan bepergian minggu depan."],["田中(たなか)さんはかぜをひいたらしくて、今日(きょう)は休(やす)んでいる。","Sepertinya Tanaka masuk angin, hari ini dia libur."]],"n":"Nomina + らしい juga berarti “khas, pantas” (子供らしい), maknanya berbeda."},{"t":"～って（引用(いんよう)）","r":"Bentuk biasa + って (lisan)","m":"Katanya; yang namanya ... (bentuk lisan dari と dan というのは).","ex":[["先生(せんせい)が、明日(あした)は休(やす)みだって。","Kata guru, besok libur."],["田中(たなか)さんって、どんな人(ひと)？","Tanaka itu orang yang seperti apa?"]],"n":"Hanya untuk lisan santai. Dalam tulisan pakai と atau という."},{"t":"～と言(い)われている","r":"Bentuk biasa + と言われている","m":"Konon, dikatakan bahwa ... (anggapan umum).","ex":[["この茶(ちゃ)は、体(からだ)にいいと言(い)われている。","Teh ini konon baik untuk tubuh."],["日本(にほん)は、安全(あんぜん)な国(くに)だと言(い)われている。","Jepang dikatakan sebagai negara yang aman."]],"n":"Menyampaikan anggapan umum, bukan pendapat pribadi. Lebih formal: ～とされている."},{"t":"～のだ／～んです","r":"Bentuk biasa (Adj-na dan Nomina: 〜な) + のだ / んです","m":"Penjelasan atau alasan; juga untuk meminta penjelasan.","ex":[["どうして遅(おく)れたんですか。― 電車(でんしゃ)が止(と)まったんです。","Kenapa terlambat? — Karena keretanya berhenti."],["顔色(かおいろ)が悪(わる)いですね。具合(ぐあい)が悪(わる)いんですか。","Wajahmu pucat. Apakah kamu kurang sehat?"]],"n":"Dalam lisan menjadi ～んです atau ～の？ untuk bertanya."},{"t":"～わけではない","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜という / 〜の) + わけではない","m":"Bukan berarti ... (menyangkal sebagian atau kesimpulan yang keliru).","ex":[["お酒(さけ)は飲(の)まないが、嫌(きら)いなわけではない。","Aku tidak minum alkohol, tapi bukan berarti tidak suka."],["お金(かね)があれば幸(しあわ)せになれるというわけではない。","Bukan berarti kalau punya uang pasti bisa bahagia."]],"n":"Jangan tertukar dengan ～わけがない (tidak mungkin)."},{"t":"～はずだ","r":"Bentuk biasa (Adj-na: 〜な, Nomina: 〜の) + はずだ","m":"Seharusnya, pasti (dugaan yang punya dasar logis).","ex":[["彼(かれ)はいつも早(はや)いから、もうすぐ来(く)るはずだ。","Dia selalu datang lebih awal, jadi seharusnya sebentar lagi tiba."],["この漢字(かんじ)は先週(せんしゅう)習(なら)ったはずなのに、忘(わす)れてしまった。","Kanji ini seharusnya sudah dipelajari minggu lalu, tapi malah lupa."]],"n":"～はずなのに berarti “padahal seharusnya”."},{"t":"～に違(ちが)いない","r":"V / Adj-i bentuk biasa; Adj-na dan Nomina tanpa だ + に違いない","m":"Pasti, tidak salah lagi (keyakinan kuat pembicara).","ex":[["あの店(みせ)はいつも客(きゃく)が多(おお)いから、きっとおいしいに違(ちが)いない。","Toko itu selalu ramai pengunjung, pasti enak."],["窓(まど)が開(あ)いている。誰(だれ)かが入(はい)ったに違(ちが)いない。","Jendelanya terbuka. Pasti ada yang masuk."]],"n":"Lebih kuat daripada ～かもしれない dan ～だろう."}]},{"g":"Pemberian & Permintaan","items":[{"t":"～てあげる","r":"V て + あげる / やる / さしあげる","m":"Melakukan sesuatu untuk orang lain (sebagai kebaikan).","ex":[["弟(おとうと)に宿題(しゅくだい)を教(おし)えてあげた。","Aku mengajari adikku mengerjakan PR."],["友達(ともだち)に、重(おも)い荷物(にもつ)を持(も)ってあげた。","Aku membawakan barang berat untuk temanku."]],"n":"Kepada atasan terdengar menggurui. Lebih baik tawarkan dengan ～ましょうか."},{"t":"～てくれる","r":"V て + くれる / くださる","m":"(Orang lain) melakukan sesuatu untukku atau kelompokku.","ex":[["友達(ともだち)が駅(えき)まで迎(むか)えに来(き)てくれた。","Temanku datang menjemput sampai stasiun."],["母(はは)は、毎朝(まいあさ)お弁当(べんとう)を作(つく)ってくれる。","Ibu membuatkan bekal setiap pagi."]],"n":"Sudut pandang penerima dan ada rasa terima kasih. Untuk pihak yang dihormati: ～てくださる."},{"t":"～てもらう","r":"V て + もらう / いただく","m":"Menerima tindakan baik dari orang lain (meminta atau dibantu).","ex":[["先生(せんせい)に作文(さくぶん)を直(なお)してもらった。","Saya minta guru memperbaiki karangan saya."],["友達(ともだち)に宿題(しゅくだい)を手伝(てつだ)ってもらった。","Aku dibantu temanku mengerjakan PR."]],"n":"Pelaku tindakan ditandai に (atau から). Untuk meminta dengan halus: ～てもらえませんか."},{"t":"～てください／～てくれませんか（依頼(いらい)）","r":"V て + ください / くれませんか / もらえませんか","m":"Tolong ... (permintaan).","ex":[["すみませんが、もう一度(いちど)言(い)ってください。","Maaf, tolong katakan sekali lagi."],["この荷物(にもつ)を、運(はこ)んでもらえませんか。","Bisakah Anda tolong membawakan barang ini?"]],"n":"Makin ke kanan makin sopan: ください → くれませんか → もらえませんか → いただけませんか."},{"t":"～ように言(い)う／頼(たの)む","r":"V kamus / V ない + ように + 言う / 頼む / 注意する","m":"Menyuruh atau meminta secara tidak langsung agar ...","ex":[["医者(いしゃ)に、お酒(さけ)を飲(の)まないように言(い)われた。","Dokter menyuruhku jangan minum alkohol."],["友達(ともだち)に、明日(あした)の朝(あさ)電話(でんわ)するように頼(たの)んだ。","Aku meminta temanku menelepon besok pagi."]],"n":"Kutipan tidak langsung dari perintah atau permintaan. Kutipan langsung memakai ～と言った."},{"t":"～(ら)れる（受身(うけみ)）","r":"Gol.1: V ない + れる (書かれる); Gol.2: V ない + られる (食べられる); する → される; くる → こられる","m":"Dikenai tindakan; diperlakukan ... (kalimat pasif).","ex":[["私(わたし)は先生(せんせい)にほめられた。","Saya dipuji oleh guru."],["電車(でんしゃ)の中(なか)で、財布(さいふ)を取(と)られた。","Di dalam kereta, dompetku diambil orang."]],"n":"Ada pasif yang bernuansa merugikan: 雨に降られた (kehujanan). Pelaku ditandai に."},{"t":"～(さ)せる（使役(しえき)）","r":"Gol.1: V ない + せる (書かせる); Gol.2: V ない + させる (食べさせる); する → させる; くる → こさせる","m":"Menyuruh atau membiarkan orang lain melakukan ... (kausatif).","ex":[["母(はは)は、子供(こども)に野菜(やさい)を食(た)べさせた。","Ibu menyuruh anaknya makan sayur."],["部長(ぶちょう)は、新入社員(しんにゅうしゃいん)に資料(しりょう)を作(つく)らせた。","Manajer menyuruh karyawan baru membuat dokumen."]],"n":"Bisa berarti menyuruh atau mengizinkan. Pelaku ditandai に (untuk kata kerja intransitif: を)."},{"t":"～(さ)せられる（使役受身(しえきうけみ)）","r":"Gol.1: V ない + せられる / される; Gol.2: V ない + させられる; する → させられる","m":"Dipaksa melakukan ... (terpaksa karena disuruh orang lain).","ex":[["子供(こども)のころ、母(はは)に毎日(まいにち)ピアノを練習(れんしゅう)させられた。","Waktu kecil, aku dipaksa ibu berlatih piano tiap hari."],["先輩(せんぱい)に、荷物(にもつ)を持(も)たされた。","Aku disuruh senior membawa barangnya."]],"n":"Bernuansa terpaksa dan tidak senang. Bentuk pendek Gol.1: 読まされる."}]},{"g":"Ungkapan Sopan","items":[{"t":"お～になる／ご～になる","r":"お + V bentuk ます (tanpa ます) + になる; ご + Nomina + になる","m":"Bentuk hormat (尊敬語) untuk tindakan orang yang dihormati.","ex":[["社長(しゃちょう)は、もうお帰(かえ)りになりました。","Direktur sudah pulang."],["先生(せんせい)は、毎朝(まいあさ)新聞(しんぶん)をお読(よ)みになります。","Guru membaca koran setiap pagi."]],"n":"Tidak dipakai untuk tindakan diri sendiri. Kata kerja yang punya bentuk hormat khusus (いらっしゃる, おっしゃる) memakai bentuk itu."},{"t":"お～する／ご～する","r":"お + V bentuk ます (tanpa ます) + する; ご + Nomina + する","m":"Bentuk merendah (謙譲語) ketika melakukan sesuatu untuk orang yang dihormati.","ex":[["重(おも)いですね。お持(も)ちしましょうか。","Berat ya. Mau saya bawakan?"],["来週(らいしゅう)、資料(しりょう)をお送(おく)りします。","Minggu depan saya kirimkan dokumennya."]],"n":"Hanya untuk tindakan diri sendiri. Contoh dengan ご: ご案内(あんない)します."},{"t":"～ていただく","r":"V て + いただく","m":"Menerima kebaikan dari orang yang dihormati (bentuk sopan ～てもらう).","ex":[["先生(せんせい)に、作文(さくぶん)を見(み)ていただきました。","Saya minta guru memeriksa karangan saya."],["遠(とお)いところ、来(き)ていただいて、ありがとうございます。","Terima kasih sudah datang dari jauh."]],"n":"Permintaan sopan: ～ていただけませんか."},{"t":"～てくださる","r":"V て + くださる","m":"(Orang yang dihormati) melakukan sesuatu untukku (bentuk hormat ～てくれる).","ex":[["先生(せんせい)が、駅(えき)まで送(おく)ってくださった。","Guru mengantarku sampai stasiun."],["部長(ぶちょう)が、私(わたし)の話(はなし)を聞(き)いてくださいました。","Manajer mendengarkan ceritaku."]],"n":"Bentuk ～てください berasal dari くださる. ～てくださる mengungkapkan rasa terima kasih."},{"t":"～(さ)せていただく","r":"V ない + せていただく (する → させていただく)","m":"Izinkan saya ... (merendah sambil meminta izin).","ex":[["明日(あした)は、休(やす)ませていただきます。","Besok, izinkan saya libur."],["お先(さき)に、失礼(しつれい)させていただきます。","Izinkan saya pamit lebih dulu."]],"n":"Jangan dipakai berlebihan, karena bisa terdengar berbelit kalau sebenarnya tidak perlu izin."},{"t":"～でございます","r":"Nomina / Adj-na + でございます; Adj-i + ございます","m":"Bentuk sangat sopan dari です.","ex":[["こちらが、会議室(かいぎしつ)でございます。","Ini ruang rapatnya."],["お待(ま)たせいたしました。コーヒーでございます。","Maaf menunggu. Ini kopinya."]],"n":"Dipakai dalam bahasa pelayanan, misalnya oleh pelayan atau resepsionis."},{"t":"いらっしゃる／おっしゃる（特別(とくべつ)な尊敬語(そんけいご)）","r":"いる・行く・来る → いらっしゃる; 言う → おっしゃる; する → なさる; 見る → ご覧になる; 食べる・飲む → 召し上がる","m":"Kata kerja hormat khusus untuk tindakan orang yang dihormati.","ex":[["社長(しゃちょう)は、今(いま)会議室(かいぎしつ)にいらっしゃいます。","Direktur sekarang ada di ruang rapat."],["先生(せんせい)がおっしゃったことを、メモしました。","Saya mencatat apa yang dikatakan guru."]],"n":"Bentuk ます-nya tidak biasa: いらっしゃいます, おっしゃいます, なさいます, くださいます."},{"t":"申(もう)す／参(まい)る／いたす（特別(とくべつ)な謙譲語(けんじょうご)）","r":"言う → 申す / 申し上げる; 行く・来る → 参る; する → いたす; いる → おる; 食べる・飲む・もらう → いただく; 見る → 拝見する","m":"Kata kerja merendah khusus untuk tindakan diri sendiri terhadap orang yang dihormati.","ex":[["はじめまして。田中(たなか)と申(もう)します。","Perkenalkan, saya bernama Tanaka."],["明日(あした)の午後(ごご)、そちらへ参(まい)ります。","Besok sore saya akan datang ke sana."]],"n":"Hanya untuk diri sendiri atau kelompok sendiri. Jangan dipakai untuk tindakan orang yang dihormati."}]}],"kj":[{"rad":"氵","nm":"さんずい","mean":"air","items":[{"k":"消","a":"menghilang; memadamkan","on":"ショウ","kun":"き-える、け-す","rad":"氵 (air)","h":"Air (氵) yang memadamkan api: lenyap, mati.","v":[["消(き)える","lenyap"],["消(け)す","menghapus; mematikan"],["消化(しょうか)","pencernaan"],["消灯(しょうとう)","lampu dipadamkan"],["消(け)しゴム","penghapus"]]},{"k":"渡","a":"menyeberang; menyerahkan","on":"ト","kun":"わた-る、わた-す","rad":"氵 (air)","h":"Air (氵) yang haru const RM={};'a あ i い u う e え o お ka か ki き ku く ke け ko こ sa さ shi し si し su す se せ so そ ta た chi ち ti ち tsu つ tu つ te て to と na な ni に nu ぬ ne ね no の ha は hi ひ fu ふ hu ふ he へ ho ほ ma ま mi み mu む me め mo も ya や yu ゆ yo よ ra ら ri り ru る re れ ro ろ wa わ wo を ga が gi ぎ gu ぐ ge げ go ご za ざ ji じ zi じ zu ず ze ぜ zo ぞ da だ de で do ど ba ば bi び bu ぶ be べ bo ぼ pa ぱ pi ぴ pu ぷ pe ぺ po ぽ kya きゃ kyu きゅ kyo きょ sha しゃ shu しゅ sho しょ sya しゃ syu しゅ syo しょ cha ちゃ chu ちゅ cho ちょ tya ちゃ tyu ちゅ tyo ちょ nya にゃ nyu にゅ nyo にょ hya ひゃ hyu ひゅ hyo ひょ mya みゃ myu みゅ myo みょ rya りゃ ryu りゅ ryo りょ gya ぎゃ gyu ぎゅ gyo ぎょ ja じゃ ju じゅ jo じょ jya じゃ jyu じゅ jyo じょ bya びゃ byu びゅ byo びょ pya ぴゃ pyu ぴゅ pyo ぴょ'.split(' ').forEach((v,i,a)=>{if(i%2==0)RM[v]=a[i+1]});
const rk=q=>{if(!/^[a-z' -]+$/.test(q))return q;const s=q.replace(/[ ']/g,'');let o='';for(let i=0;i<s.length;){const c=s[i];if(c==='-'){o+='ー';i++;continue}if(c===s[i+1]&&/[bcdfghjklmpqrstvwxyz]/.test(c)){o+='っ';i++;continue}let m=0;for(let n=3;n>0;n--){const r=RM[s.substr(i,n)];if(r){o+=r;i+=n;m=1;break}}if(!m){o+=c==='n'?'ん':c;i++}}return o};
const lq=s=>s.replace(/[うー]/g,'');
const mt=(it,q)=>{const h=toH(rk(q));return it.s.toLowerCase().includes(q)||it.sh.includes(h)||(lq(h).length>1&&lq(it.sh).includes(lq(h)))};

function srItems(){let L=SR.mode==='kj'?KJ:BPL;if(SR.scope==='hard')L=L.filter(x=>S.hd[ck(SR.mode,x)]);else if(SR.scope.startsWith('t:'))L=(TH().find(t=>t.n===SR.scope.slice(2))||{k:[]}).k;else if(SR.scope.startsWith('g:'))L=(D.bp[+SR.scope.slice(2)]||{items:[]}).items;else if(SR.mode==='kj'&&SR.scope!=='all')L=L.filter(k=>k.sec===SR.scope);return L}
function srNext(s,g){s=s||{iv:0,ef:2.5,r:0};let{iv,ef,r}=s;if(g===0){iv=0;r=0;ef=Math.max(1.3,ef-.2)}else if(g===1){iv=Math.max(1,Math.round(iv*1.2));ef=Math.max(1.3,ef-.15)}else{iv=r===0?1:r===1?3:Math.round(iv*ef);r++}return{d:day()+iv,iv,ef,r}}

function statsHTML(){const t=day(),wk=[0,1,2,3,4,5,6].map(i=>{const d=t-6+i,l=S.dy.log[d]||{c:0,q:0};return{d,v:l.c+l.q}}),mx=Math.max(1,...wk.map(x=>x.v)),w=Object.entries(S.dy.wc||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class='card'><b>7 hari terakhir</b><p class='mu'>Kartu diulang dan soal dijawab per hari. Streak: ${streak()} hari.</p><div style='display:flex;align-items:flex-end;gap:6px;height:100px'>${wk.map(x=>`<div style='flex:1;text-align:center;font-size:11px'>${x.v}<div style='height:${x.v/mx*60}px;min-height:2px;background:var(--gr);border-radius:4px'></div>${DN[new Date(x.d*864e5).getUTCDay()]}</div>`).join('')}</div></div>`+(w.length?`<div class='card'><b>Soal paling sering salah</b>${w.map(([k,n])=>{const[s,i]=k.split(':'),q=s==='ks'?null:(s==='bp'?D.bq:D.kq)[i];return q?`<p>${rb(q.q)}<br><span class='mu'>Jawaban: ${rb(q.o[q.k])} · salah ${n}×</span></p>`:''}).join('')}</div>`:'')}
const BACA=[{"t":"引(ひ)っ越(こ)し","lv":"N3 · esai pendek","x":"先月(せんげつ)、私(わたし)は大阪(おおさか)から東京(とうきょう)へ引(ひ)っ越(こ)した。新(あたら)しい町(まち)は便利(べんり)だが、夜(よる)でもにぎやかなので、最初(さいしょ)はなかなか寝(ね)られなかった。そこで、窓(まど)に厚(あつ)いカーテンをつけることにした。すると、少(すこ)しずつ眠(ねむ)れるようになった。今(いま)では、この町(まち)の音(おと)にもすっかり慣(な)れている。","a":"Bulan lalu, saya pindah dari Osaka ke Tokyo. Kota yang baru ini praktis, tetapi ramai bahkan di malam hari, jadi pada awalnya saya sulit sekali tidur. Karena itu, saya memutuskan memasang tirai tebal di jendela. Lalu, sedikit demi sedikit saya jadi bisa tidur. Sekarang, saya sudah benar-benar terbiasa dengan suara kota ini.","q":[{"q":"この人(ひと)は、なぜ最初(さいしょ)よく寝(ね)られなかったのですか。","o":["窓(まど)が開(あ)いていたから","夜(よる)でもにぎやかだったから","仕事(しごと)が忙(いそが)しかったから","大阪(おおさか)が恋(こい)しかったから"],"k":1},{"q":"寝(ね)られるようにするために、この人(ひと)は何(なに)をしましたか。","o":["窓(まど)に厚(あつ)いカーテンをつけた","部屋(へや)を変(か)えた","薬(くすり)を飲(の)んだ","大阪(おおさか)に帰(かえ)った"],"k":0},{"q":"今(いま)、この人(ひと)は町(まち)の音(おと)をどう思(おも)っていますか。","o":["まだ気(き)になる","とても好(す)きだ","少(すこ)し怖(こわ)い","もう慣(な)れている"],"k":3}]},{"t":"図書館(としょかん)のお知(し)らせ","lv":"N3 · pengumuman","x":"来週(らいしゅう)の月曜日(げつようび)から三日間(みっかかん)、本(ほん)の整理(せいり)のため、二階(にかい)の読書室(どくしょしつ)は使(つか)えません。ただし、一階(いっかい)で本(ほん)を借(か)りたり返(かえ)したりすることはできます。パソコンを使(つか)いたい人(ひと)は、三階(さんかい)の部屋(へや)を利用(りよう)してください。","a":"Mulai Senin depan selama tiga hari, ruang baca di lantai dua tidak bisa dipakai karena penataan buku. Namun, meminjam dan mengembalikan buku di lantai satu tetap bisa dilakukan. Yang ingin memakai komputer, silakan gunakan ruangan di lantai tiga.","q":[{"q":"二階(にかい)の読書室(どくしょしつ)は、いつ使(つか)えませんか。","o":["今日(きょう)から一週間(いっしゅうかん)","来月(らいげつ)の月曜日(げつようび)","来週(らいしゅう)の月曜日(げつようび)から三日間(みっかかん)","毎週(まいしゅう)の月曜日(げつようび)"],"k":2},{"q":"本(ほん)を返(かえ)したい人(ひと)は、どうすればいいですか。","o":["三階(さんかい)へ行(い)く","一階(いっかい)で返(かえ)す","来週(らいしゅう)まで待(ま)つ","二階(にかい)で返(かえ)す"],"k":1},{"q":"パソコンを使(つか)いたい人(ひと)は、どこへ行(い)きますか。","o":["三階(さんかい)の部屋(へや)","一階(いっかい)の入(い)り口(ぐち)","二階(にかい)の読書室(どくしょしつ)","図書館(としょかん)の外(そと)"],"k":0}]},{"t":"会議(かいぎ)の変更(へんこう)","lv":"N3 · email","x":"田中(たなか)さん、お疲(つか)れさまです。明日(あした)の会議(かいぎ)ですが、部長(ぶちょう)の都合(つごう)で、午後(ごご)二時(にじ)から三時(さんじ)に変(か)わりました。場所(ばしょ)は同(おな)じです。資料(しりょう)は私(わたし)が前(まえ)の日(ひ)に準備(じゅんび)しておきます。もし来(こ)られない場合(ばあい)は、今日(きょう)中(じゅう)に連絡(れんらく)してください。山田(やまだ)","a":"Pak Tanaka, terima kasih atas kerja kerasnya. Mengenai rapat besok, karena kesibukan kepala bagian, jamnya berubah dari pukul dua siang menjadi pukul tiga. Tempatnya sama. Dokumennya akan saya siapkan sehari sebelumnya. Kalau Anda tidak bisa hadir, tolong hubungi saya hari ini. Yamada","q":[{"q":"会議(かいぎ)はどうなりましたか。","o":["場所(ばしょ)が変(か)わった","中止(ちゅうし)になった","明日(あした)ではなくなった","時間(じかん)が変(か)わった"],"k":3},{"q":"資料(しりょう)は、だれが準備(じゅんび)しますか。","o":["田中(たなか)さん","部長(ぶちょう)","山田(やまだ)さん","みんな"],"k":2},{"q":"会議(かいぎ)に来(こ)られない人(ひと)は、どうしますか。","o":["明日(あした)の朝(あさ)に連絡(れんらく)する","今日(きょう)中(じゅう)に連絡(れんらく)する","部長(ぶちょう)に資料(しりょう)を渡(わた)す","何(なに)もしなくていい"],"k":1}]},{"t":"歩(ある)いて通勤(つうきん)","lv":"N3 · esai pendek","x":"私(わたし)は毎朝(まいあさ)、会社(かいしゃ)まで歩(ある)いて行(い)くようにしている。電車(でんしゃ)で行(い)けば二十分(にじゅっぷん)で着(つ)くが、歩(ある)くと四十分(よんじゅっぷん)かかる。それでも、歩(ある)くと頭(あたま)がすっきりして、仕事(しごと)にも集中(しゅうちゅう)できる。最初(さいしょ)は疲(つか)れたが、続(つづ)けているうちに体(からだ)も強(つよ)くなった。雨(あめ)の日(ひ)だけは、電車(でんしゃ)を使(つか)うことにしている。","a":"Setiap pagi, saya berusaha berjalan kaki ke kantor. Kalau naik kereta, sampai dalam dua puluh menit, tetapi berjalan memakan waktu empat puluh menit. Meski begitu, kalau berjalan, kepala jadi segar dan saya bisa berkonsentrasi dalam bekerja. Awalnya saya lelah, tetapi selagi terus melakukannya, tubuh saya pun jadi lebih kuat. Hanya di hari hujan, saya memutuskan naik kereta.","q":[{"q":"雨(あめ)の日(ひ)、この人(ひと)はどうしますか。","o":["電車(でんしゃ)を使(つか)う","歩(ある)いて行(い)く","会社(かいしゃ)を休(やす)む","車(くるま)で行(い)く"],"k":0},{"q":"歩(ある)くと、どんないいことがありますか。","o":["早(はや)く会社(かいしゃ)に着(つ)く","お金(かね)がたくさん貯(た)まる","友達(ともだち)ができる","頭(あたま)がすっきりして集中(しゅうちゅう)できる"],"k":3},{"q":"会社(かいしゃ)まで歩(ある)くと、どのくらいかかりますか。","o":["二十分(にじゅっぷん)","三十分(さんじゅっぷん)","四十分(よんじゅっぷん)","一時間(いちじかん)"],"k":2}]},{"t":"落(お)とした財布(さいふ)","lv":"N3 · cerita pengalaman","x":"昨日(きのう)、駅(えき)で財布(さいふ)を落(お)としてしまった。中(なか)には現金(げんきん)と定期券(ていきけん)が入(はい)っていたので、とても困(こま)った。駅員(えきいん)に聞(き)いたところ、親切(しんせつ)な人(ひと)が届(とど)けてくれたと言(い)われた。お金(かね)も全部(ぜんぶ)残(のこ)っていた。名前(なまえ)も知(し)らないその人(ひと)に、心(こころ)から感謝(かんしゃ)している。これからは、バッグのファスナーをしっかり閉(し)めることにする。","a":"Kemarin, saya menjatuhkan dompet di stasiun. Di dalamnya ada uang tunai dan kartu langganan, jadi saya sangat kebingungan. Ketika saya bertanya kepada petugas stasiun, saya diberi tahu bahwa ada orang baik yang mengantarkannya. Uangnya pun masih utuh semua. Saya sangat berterima kasih kepada orang yang namanya pun tidak saya ketahui itu. Mulai sekarang, saya memutuskan menutup ritsleting tas dengan rapat.","q":[{"q":"財布(さいふ)は、どうなりましたか。","o":["見(み)つからなかった","親切(しんせつ)な人(ひと)が届(とど)けてくれた","駅員(えきいん)が買(か)ってくれた","自分(じぶん)で見(み)つけた"],"k":1},{"q":"財布(さいふ)の中(なか)のお金(かね)は、どうでしたか。","o":["全部(ぜんぶ)残(のこ)っていた","半分(はんぶん)なくなっていた","少(すこ)し増(ふ)えていた","全部(ぜんぶ)なくなっていた"],"k":0},{"q":"これから、この人(ひと)はどうすることにしましたか。","o":["電車(でんしゃ)に乗(の)らない","新(あたら)しい財布(さいふ)を買(か)う","現金(げんきん)を持(も)たない","バッグのファスナーをしっかり閉(し)める"],"k":3}]},{"t":"料理教室(りょうりきょうしつ)のご案内(あんない)","lv":"N3 · iklan","x":"毎週(まいしゅう)土曜日(どようび)の午前(ごぜん)十時(じゅうじ)から、駅前(えきまえ)の料理教室(りょうりきょうしつ)で和食(わしょく)を習(なら)うことができます。初(はじ)めての方(かた)でも、先生(せんせい)が一(ひと)つずつ教(おし)えてくれるので安心(あんしん)です。参加費(さんかひ)は一回(いっかい)三千円(さんぜんえん)で、材料(ざいりょう)は教室(きょうしつ)で用意(ようい)します。申(もう)し込(こ)みは、電話(でんわ)かメールでお願(ねが)いします。","a":"Setiap Sabtu pukul sepuluh pagi, Anda bisa belajar masakan Jepang di kelas memasak depan stasiun. Bahkan bagi yang baru pertama kali, Anda tenang karena guru mengajarkan satu per satu. Biaya partisipasi tiga ribu yen sekali pertemuan, dan bahan disiapkan oleh kelas. Pendaftaran silakan lewat telepon atau email.","q":[{"q":"この教室(きょうしつ)では、何(なに)を習(なら)いますか。","o":["洋食(ようしょく)","お菓子(かし)","和食(わしょく)","中華料理(ちゅうかりょうり)"],"k":2},{"q":"料理(りょうり)の材料(ざいりょう)は、どうなりますか。","o":["自分(じぶん)で買(か)ってくる","教室(きょうしつ)で用意(ようい)する","先生(せんせい)が家(いえ)に持(も)ってくる","みんなで分(わ)けて持(も)ってくる"],"k":1},{"q":"申(もう)し込(こ)みは、どうすればいいですか。","o":["電話(でんわ)かメールで連絡(れんらく)する","駅前(えきまえ)の店(みせ)で話(はな)す","土曜日(どようび)に直接(ちょくせつ)行(い)く","手紙(てがみ)を書(か)く"],"k":0}]},{"t":"駅(えき)で道(みち)を聞(き)く","lv":"N3 · dialog","x":"A「すみません、図書館(としょかん)へ行(い)きたいんですが、この道(みち)をまっすぐ行(い)けばいいですか。」B「いいえ、この道(みち)は工事中(こうじちゅう)ですから、通(とお)れませんよ。駅(えき)の北口(きたぐち)から出(で)て、右(みぎ)に曲(ま)がってください。五分(ごふん)ぐらい歩(ある)くと、大(おお)きい白(しろ)い建物(たてもの)があります。それが図書館(としょかん)です。」A「ありがとうございます。助(たす)かりました。」","a":"A: Permisi, saya ingin pergi ke perpustakaan, apakah cukup lurus lewat jalan ini? B: Tidak, jalan ini sedang dalam perbaikan, jadi tidak bisa dilewati. Keluarlah dari pintu utara stasiun, lalu belok kanan. Kalau berjalan sekitar lima menit, ada bangunan putih yang besar. Itulah perpustakaannya. A: Terima kasih. Sangat membantu.","q":[{"q":"A(エー)さんは、何(なに)をしたいですか。","o":["駅(えき)へ行(い)きたい","工事(こうじ)を見(み)たい","白(しろ)い建物(たてもの)を作(つく)りたい","図書館(としょかん)へ行(い)きたい"],"k":3},{"q":"この道(みち)は、なぜ通(とお)れませんか。","o":["人(ひと)が多(おお)いから","雨(あめ)が降(ふ)っているから","工事中(こうじちゅう)だから","駅(えき)から遠(とお)いから"],"k":2},{"q":"図書館(としょかん)は、どんな建物(たてもの)ですか。","o":["小(ちい)さくて古(ふる)い","大(おお)きくて白(しろ)い","高(たか)くて黒(くろ)い","駅(えき)の中(なか)にある"],"k":1}]},{"t":"朝型(あさがた)の生活(せいかつ)","lv":"N3 · esai","x":"以前(いぜん)の私(わたし)は、夜(よる)遅(おそ)くまで起(お)きていて、朝(あさ)はぎりぎりに起(お)きる生活(せいかつ)だった。朝(あさ)ごはんも食(た)べずに、急(いそ)いで会社(かいしゃ)へ行(い)くことが多(おお)かった。しかし、ある日(ひ)、体(からだ)の調子(ちょうし)が悪(わる)くなって、医者(いしゃ)に「生活(せいかつ)を変(か)えたほうがいい」と言(い)われた。それをきっかけに、私(わたし)は早(はや)く寝(ね)て早(はや)く起(お)きるようにした。朝(あさ)の時間(じかん)に余裕(よゆう)ができたおかげで、ゆっくり朝(あさ)ごはんを食(た)べられるし、気持(きも)ちも落(お)ち着(つ)いた。今(いま)では、朝型(あさがた)の生活(せいかつ)をやめたくない。","a":"Dulu, saya terjaga sampai larut malam dan bangun mepet waktu di pagi hari. Saya sering buru-buru ke kantor tanpa sarapan. Namun suatu hari, kondisi tubuh saya memburuk dan dokter berkata, “Sebaiknya ubah gaya hidup.” Berawal dari itu, saya berusaha tidur cepat dan bangun cepat. Berkat adanya kelonggaran waktu di pagi hari, saya bisa sarapan dengan tenang dan perasaan pun lebih tenteram. Sekarang, saya tidak ingin meninggalkan gaya hidup pagi.","q":[{"q":"以前(いぜん)、この人(ひと)の生活(せいかつ)はどうでしたか。","o":["夜(よる)遅(おそ)くまで起(お)きて、朝(あさ)はぎりぎりに起(お)きていた","朝(あさ)早(はや)く起(お)きて散歩(さんぽ)していた","毎朝(まいあさ)ゆっくり朝(あさ)ごはんを食(た)べていた","毎日(まいにち)会社(かいしゃ)を休(やす)んでいた"],"k":0},{"q":"生活(せいかつ)を変(か)えるきっかけは何(なん)でしたか。","o":["友達(ともだち)に誘(さそ)われたこと","会社(かいしゃ)が変(か)わったこと","新(あたら)しい家(いえ)に引(ひ)っ越(こ)したこと","体(からだ)の調子(ちょうし)が悪(わる)くなって、医者(いしゃ)に言(い)われたこと"],"k":3},{"q":"生活(せいかつ)を変(か)えて、どんないいことがありましたか。","o":["給料(きゅうりょう)が上(あ)がった","夜(よる)の時間(じかん)が長(なが)くなった","ゆっくり朝(あさ)ごはんが食(た)べられて、気持(きも)ちも落(お)ち着(つ)いた","仕事(しごと)が楽(らく)になった"],"k":2},{"q":"今(いま)、この人(ひと)はどう思(おも)っていますか。","o":["前(まえ)の生活(せいかつ)に戻(もど)りたい","朝型(あさがた)の生活(せいかつ)をやめたくない","もっと遅(おそ)くまで起(お)きたい","生活(せいかつ)を変(か)えなければよかった"],"k":1}]},{"t":"アルバイト募集(ぼしゅう)","lv":"N3 · pengumuman","x":"駅前(えきまえ)の本屋(ほんや)では、アルバイトを募集(ぼしゅう)しています。仕事(しごと)は、本(ほん)を並(なら)べたり、お客(きゃく)さんの質問(しつもん)に答(こた)えたりすることです。時間(じかん)は、平日(へいじつ)の夕方(ゆうがた)五時(ごじ)から九時(くじ)までで、週(しゅう)に三日(みっか)以上(いじょう)働(はたら)ける人(ひと)を探(さが)しています。経験(けいけん)は必要(ひつよう)ありませんが、本(ほん)が好(す)きな人(ひと)を歓迎(かんげい)します。興味(きょうみ)がある人(ひと)は、店(みせ)の人(ひと)に声(こえ)をかけてください。","a":"Toko buku di depan stasiun sedang membuka lowongan kerja paruh waktu. Pekerjaannya adalah menata buku dan menjawab pertanyaan pelanggan. Waktunya pukul lima sampai sembilan malam pada hari kerja, dan kami mencari orang yang bisa bekerja tiga hari atau lebih dalam seminggu. Pengalaman tidak diperlukan, tetapi kami menyambut orang yang menyukai buku. Yang berminat, silakan hubungi petugas toko.","q":[{"q":"アルバイトの仕事(しごと)は、何(なん)ですか。","o":["本(ほん)を並(なら)べたり、質問(しつもん)に答(こた)えたりすること","本(ほん)を書(か)くこと","本(ほん)を作(つく)ること","本(ほん)を運転(うんてん)すること"],"k":0},{"q":"働(はたら)く時間(じかん)は、いつですか。","o":["毎日(まいにち)の朝(あさ)","土曜日(どようび)と日曜日(にちようび)の昼(ひる)","週(しゅう)に一日(いちにち)だけ","平日(へいじつ)の夕方(ゆうがた)五時(ごじ)から九時(くじ)まで"],"k":3},{"q":"どんな人(ひと)を歓迎(かんげい)しますか。","o":["経験(けいけん)がたくさんある人(ひと)","本屋(ほんや)の近(ちか)くに住(す)んでいる人(ひと)","本(ほん)が好(す)きな人(ひと)","毎日(まいにち)働(はたら)ける人(ひと)"],"k":2}]},{"t":"友達(ともだち)への手紙(てがみ)","lv":"N3 · surat","x":"お元気(げんき)ですか。先週(せんしゅう)、初(はじ)めて一人(ひとり)で京都(きょうと)へ旅行(りょこう)しました。電車(でんしゃ)の中(なか)から見(み)えた山(やま)がとてもきれいでした。お寺(てら)を見(み)たあと、小(ちい)さい店(みせ)でお茶(ちゃ)を飲(の)みました。店(みせ)の人(ひと)が親切(しんせつ)で、おすすめの場所(ばしょ)を教(おし)えてくれました。次(つぎ)は、あなたと一緒(いっしょ)に行(い)きたいです。来月(らいげつ)、会(あ)えるのを楽(たの)しみにしています。","a":"Apa kabar? Minggu lalu, untuk pertama kalinya saya bepergian sendirian ke Kyoto. Gunung yang terlihat dari dalam kereta sangat indah. Setelah melihat kuil, saya minum teh di sebuah toko kecil. Orang toko itu ramah dan memberi tahu saya tempat-tempat yang direkomendasikan. Lain kali, saya ingin pergi bersamamu. Saya menantikan pertemuan kita bulan depan.","q":[{"q":"この人(ひと)は、だれと京都(きょうと)へ行(い)きましたか。","o":["友達(ともだち)と","一人(ひとり)で","家族(かぞく)と","会社(かいしゃ)の人(ひと)と"],"k":1},{"q":"小(ちい)さい店(みせ)で、何(なに)をしましたか。","o":["お茶(ちゃ)を飲(の)んだ","お寺(てら)を見(み)た","お土産(みやげ)を買(か)った","写真(しゃしん)を撮(と)った"],"k":0},{"q":"店(みせ)の人(ひと)は、何(なに)をしてくれましたか。","o":["お茶(ちゃ)を無料(むりょう)にしてくれた","駅(えき)まで送(おく)ってくれた","京都(きょうと)の地図(ちず)をくれた","おすすめの場所(ばしょ)を教(おし)えてくれた"],"k":3},{"q":"この人(ひと)は、次(つぎ)にどうしたいですか。","o":["また一人(ひとり)で行(い)きたい","手紙(てがみ)をもらいたい","友達(ともだち)と一緒(いっしょ)に行(い)きたい","別(べつ)の町(まち)へ引(ひ)っ越(こ)したい"],"k":2}]},{"t":"スマホと私(わたし)","lv":"N3 · esai panjang","x":"私(わたし)は一日(いちにち)に五時間(ごじかん)ぐらいスマホを見(み)ていた。仕事(しごと)の連絡(れんらく)だけでなく、動画(どうが)やゲームにも時間(じかん)を使(つか)っていたからだ。ところが、ある日(ひ)、友達(ともだち)と食事(しょくじ)をしているときに、ずっとスマホを見(み)ていて「今日(きょう)はあまり話(はな)さなかったね」と言(い)われてしまった。その言葉(ことば)が心(こころ)に残(のこ)り、私(わたし)はスマホの使(つか)い方(かた)を考(かんが)えるようになった。今(いま)は、食事(しょくじ)中(ちゅう)と寝(ね)る前(まえ)の一時間(いちじかん)は使(つか)わないことにしている。最初(さいしょ)は落(お)ち着(つ)かなかったが、本(ほん)を読(よ)む時間(じかん)が増(ふ)えて、よく眠(ねむ)れるようになった。","a":"Dulu, saya melihat ponsel sekitar lima jam sehari. Bukan hanya untuk kabar pekerjaan, tetapi juga karena waktu saya habis untuk video dan game. Namun suatu hari, ketika makan bersama teman, saya terus melihat ponsel dan dikatai, “Hari ini kita tidak banyak mengobrol, ya.” Kata-kata itu terus membekas di hati, dan saya mulai memikirkan cara memakai ponsel. Sekarang, saya memutuskan tidak memakainya saat makan dan satu jam sebelum tidur. Awalnya saya gelisah, tetapi waktu membaca buku bertambah dan saya jadi bisa tidur nyenyak.","q":[{"q":"以前(いぜん)、この人(ひと)は一日(いちにち)にどのくらいスマホを見(み)ていましたか。","o":["一時間(いちじかん)ぐらい","五時間(ごじかん)ぐらい","二時間(にじかん)ぐらい","十時間(じゅうじかん)ぐらい"],"k":1},{"q":"友達(ともだち)の言葉(ことば)を聞(き)いて、この人(ひと)はどうしましたか。","o":["スマホの使(つか)い方(かた)を考(かんが)えるようになった","スマホを捨(す)てた","友達(ともだち)と会(あ)わなくなった","仕事(しごと)をやめた"],"k":0},{"q":"今(いま)、この人(ひと)がスマホを使 )せるからだ。便利(べんり)さだけで選(えら)ぶのではなく、自分(じぶん)に合(あ)った読(よ)み方(かた)を選(えら)ぶことが大切(たいせつ)だと思(おも)う。","a":"Belakangan ini, makin banyak orang memakai buku elektronik yang bisa dibaca di ponsel. Memang buku elektronik praktis karena bisa membawa banyak buku dan ukuran hurufnya bisa diubah. Namun, saya tetap lebih suka buku kertas. Karena saya suka bunyi dan aroma saat membalik halaman, dan kalau melihat buku yang berjajar di rak, saya bisa mengingat perasaan saat membacanya. Menurut saya, yang penting bukan memilih hanya karena kepraktisan, melainkan memilih cara membaca yang cocok untuk diri sendiri.","q":[{"q":"電子書籍(でんししょせき)の便利(べんり)な点(てん)として、本文(ほんぶん)に書(か)いてあるのはどれですか。","o":["値段(ねだん)がとても安(やす)い","たくさん持(も)ち歩(ある)けて、文字(もじ)の大(おお)きさを変(か)えられる","においがいい","本棚(ほんだな)がいらなくなる"],"k":1},{"q":"筆者(ひっしゃ)が紙(かみ)の本(ほん)を好(す)きな理由(りゆう)は何(なん)ですか。","o":["ページをめくる音(おと)やにおいが好(す)きで、本棚(ほんだな)を見(み)ると気持(きも)ちを思(おも)い出(だ)せるから","電子書籍(でんししょせき)は目(め)が疲(つか)れるから","紙(かみ)の本(ほん)のほうが安(やす)いから","電子書籍(でんししょせき)は使(つか)い方(かた)が難(むずか)しいから"],"k":0},{"q":"筆者(ひっしゃ)が一番(いちばん)言(い)いたいことは何(なん)ですか。","o":["電子書籍(でんししょせき)は使(つか)わないほうがいい","紙(かみ)の本(ほん)はなくなるだろう","本(ほん)はたくさん買(か)うべきだ","便利(べんり)さだけでなく、自分(じぶん)に合(あ)った読(よ)み方(かた)を選(えら)ぶことが大切(たいせつ)だ"],"k":3},{"q":"筆者(ひっしゃ)は、電子書籍(でんししょせき)についてどう考(かんが)えていますか。","o":["便利(べんり)ではないので、使(つか)いたくない","便利(べんり)なので、これから使(つか)うつもりだ","便利(べんり)だが、自分(じぶん)は紙(かみ)の本(ほん)が好(す)きだ","よく知(し)らないので、何(なに)も言(い)えない"],"k":2}]},{"t":"約束(やくそく)の変更(へんこう)","lv":"N3 · cerita","x":"土曜日(どようび)、私(わたし)は友達(ともだち)の美咲(みさき)さんと映画(えいが)を見(み)に行(い)く約束(やくそく)をしていた。ところが、前(まえ)の日(ひ)の夜(よる)、母(はは)が熱(ねつ)を出(だ)してしまった。私(わたし)は美咲(みさき)さんに電話(でんわ)をして、事情(じじょう)を説明(せつめい)した。すると、美咲(みさき)さんは「それは大変(たいへん)だね。映画(えいが)は来週(らいしゅう)でもいいよ。お母(かあ)さんのそばにいてあげて」と言(い)ってくれた。美咲(みさき)さんの優(やさ)しい言葉(ことば)に、私(わたし)は本当(ほんとう)に救(すく)われた。","a":"Pada hari Sabtu, saya berjanji pergi menonton film dengan teman saya, Misaki. Namun, pada malam sebelumnya, ibu saya demam. Saya menelepon Misaki dan menjelaskan keadaannya. Lalu Misaki berkata, “Itu gawat, ya. Film minggu depan juga tidak apa-apa. Temani ibumu saja.” Saya benar-benar merasa tertolong oleh kata-kata lembut Misaki.","q":[{"q":"土曜日(どようび)の約束(やくそく)は、何(なん)でしたか。","o":["買(か)い物(もの)に行(い)くこと","映画(えいが)を見(み)に行(い)くこと","母(はは)に会(あ)うこと","旅行(りょこう)に行(い)くこと"],"k":1},{"q":"この人(ひと)が約束(やくそく)を変(か)えなければならなくなった理由(りゆう)は何(なん)ですか。","o":["母(はは)が熱(ねつ)を出(だ)したから","仕事(しごと)が入(はい)ったから","映画(えいが)が終(お)わったから","美咲(みさき)さんが来(こ)られなくなったから"],"k":0},{"q":"美咲(みさき)さんは、何(なん)と言(い)いましたか。","o":["映画(えいが)は行(い)かなくてもいい","すぐに来(き)てほしい","一人(ひとり)で映画(えいが)に行(い)く","来週(らいしゅう)でもいいから、お母(かあ)さんのそばにいてあげて"],"k":3},{"q":"「救(すく)われた」は、この人(ひと)がどんな気持(きも)ちだったことを表(あらわ)していますか。","o":["とても怒(おこ)っていた","悲(かな)しくて泣(な)きたかった","ほっとして、うれしかった","美咲(みさき)さんに申(もう)し訳(わけ)なかった"],"k":2}]}];

const TOP=[{"g":"Keigo dasar (敬語)","n":"Hormat (尊敬語) untuk perbuatan lawan bicara, rendah hati (謙譲語) untuk perbuatan sendiri.","it":[["いらっしゃる","Hormat: pergi / datang / ada","先生(せんせい)はもういらっしゃいました。","Gurunya sudah datang.","行(い)く / 来(く)る / いる"],["おっしゃる","Hormat: berkata","社長(しゃちょう)がおっしゃったとおりです。","Sesuai yang dikatakan direktur.","言(い)う"],["なさる","Hormat: melakukan","何(なに)をなさいますか。","Apa yang akan Anda lakukan?","する"],["召(め)し上(あ)がる","Hormat: makan / minum","どうぞ召(め)し上(あ)がってください。","Silakan dimakan.","食(た)べる / 飲(の)む"],["ご覧(らん)になる","Hormat: melihat","こちらをご覧(らん)ください。","Silakan lihat ini.","見(み)る"],["申(もう)す","Rendah hati: berkata","山田(やまだ)と申(もう)します。","Saya bernama Yamada.","言(い)う"],["伺(うかが)う","Rendah hati: bertanya / berkunjung","明日(あした)お宅(たく)に伺(うかが)います。","Besok saya berkunjung ke rumah Anda.","聞(き)く / 訪(たず)ねる / 行(い)く"],["いただく","Rendah hati: menerima / makan","お土産(みやげ)をいただきました。","Saya menerima oleh-oleh.","もらう / 食(た)べる / 飲(の)む"],["拝見(はいけん)する","Rendah hati: melihat","資料(しりょう)を拝見(はいけん)しました。","Saya sudah melihat dokumennya.","見(み)る"],["お～になる","Pola hormat untuk perbuatan orang lain","部長(ぶちょう)はもうお帰(かえ)りになりました。","Kepala bagian sudah pulang.","お帰(かえ)りになる ← 帰(かえ)る"],["お～する","Pola rendah hati untuk perbuatan sendiri","お荷物(にもつ)をお持(も)ちします。","Barang Anda saya bawakan.","お持(も)ちする ← 持(も)つ"],["くださる","Hormat: memberi kepada saya","先生(せんせい)が本(ほん)を貸(か)してくださいました。","Guru meminjamkan buku kepada saya.","くれる"],["差(さ)し上(あ)げる","Rendah hati: memberi","先生(せんせい)にお土産(みやげ)を差(さ)し上(あ)げました。","Saya memberi guru oleh-oleh.","あげる"],["参(まい)る","Rendah hati: pergi / datang","すぐに参(まい)ります。","Saya segera datang.","行(い)く / 来(く)る"]]},{"g":"Kata sambung (接続詞)","n":"Pengubah arah kalimat. Sering muncul di soal bacaan dan soal pengisi kata sambung.","it":[["しかし","Namun","頑張(がんば)った。しかし、結果(けっか)は不合格(ふごうかく)だった。","Sudah berusaha. Namun hasilnya tidak lulus."],["ところが","Tak disangka, ternyata","晴(は)れると思(おも)った。ところが、雨(あめ)が降(ふ)ってきた。","Kukira cerah. Ternyata hujan turun."],["ただし","Hanya saja (syarat / pengecualian)","入場(にゅうじょう)は無料(むりょう)です。ただし、予約(よやく)が必要(ひつよう)です。","Masuk gratis. Hanya saja perlu reservasi."],["したがって","Oleh karena itu (formal)","台風(たいふう)が接近(せっきん)している。したがって、試合(しあい)は中止(ちゅうし)する。","Topan mendekat. Karena itu pertandingan dibatalkan."],["そのため","Karena itu","電車(でんしゃ)が遅(おく)れた。そのため、会議(かいぎ)に遅刻(ちこく)した。","Kereta terlambat. Karena itu saya terlambat rapat."],["さらに","Lebih lagi","料金(りょうきん)が上(あ)がった。さらに、サービスも悪(わる)くなった。","Harga naik. Lebih lagi, layanannya memburuk."],["なお","Sebagai tambahan","会議(かいぎ)は三時(さんじ)からです。なお、資料(しりょう)は当日(とうじつ)配(くば)ります。","Rapat mulai jam tiga. Sebagai tambahan, bahan dibagikan pada hari itu."],["つまり","Dengan kata lain","彼(かれ)は父(ちち)の弟(おとうと)、つまり私(わたし)の叔父(おじ)です。","Dia adik ayah, dengan kata lain paman saya."],["ところで","Ngomong-ngomong (ganti topik)","ところで、明日(あした)の予定(よてい)はどうなっていますか。","Ngomong-ngomong, bagaimana jadwal besok?"],["ちなみに","Sebagai info tambahan","ちなみに、私(わたし)も去年(きょねん)受(う)けました。","Omong-omong, saya juga ikut tahun lalu."],["一方(いっぽう)","Di sisi lain","都市(とし)は便利(べんり)だ。一方(いっぽう)、物価(ぶっか)が高(たか)い。","Kota itu praktis. Di sisi lain, harga-harganya mahal."],["すると","Lalu, begitu itu terjadi","ドアを開(あ)けた。すると、猫(ねこ)が飛(と)び出(だ)してきた。","Pintu kubuka. Lalu kucing melompat keluar."]]},{"g":"Onomatope (オノマトペ)","n":"Kata tiruan bunyi dan keadaan. Dalam bahasa lisan sangat sering dipakai.","it":[["ぐっすり","Tidur nyenyak","昨夜(さくや)はぐっすり眠(ねむ)れた。","Semalam saya tidur nyenyak."],["ぺらぺら","Fasih berbicara","彼女(かのじょ)は英語(えいご)がぺらぺらだ。","Dia fasih berbahasa Inggris."],["そわそわ","Gelisah, tidak tenang","試験(しけん)の前(まえ)でそわそわしている。","Menjelang ujian, saya gelisah."],["イライラ","Jengkel","待(ま)たされてイライラした。","Disuruh menunggu, saya jadi jengkel."],["がっかり","Kecewa","結果(けっか)を聞(き)いてがっかりした。","Mendengar hasilnya, saya kecewa."],["ぎりぎり","Mepet","電車(でんしゃ)にぎりぎり間(ま)に合(あ)った。","Saya mepet sekali mengejar kereta."],["ぴったり","Pas sekali","この服(ふく)はサイズがぴったりだ。","Baju ini ukurannya pas sekali."],["うろうろ","Mondar-mandir","駅(えき)の前(まえ)でうろうろしている。","Dia mondar-mandir di depan stasiun."],["のんびり","Santai","休日(きゅうじつ)はのんびり過(す)ごす。","Hari libur saya habiskan dengan santai."],["じっくり","Dengan teliti, tidak tergesa","じっくり考(かんが)えて決(き)める。","Saya putuskan setelah dipikirkan dengan teliti."],["きちんと","Rapi, sebagaimana mestinya","部屋(へや)をきちんと片付(かたづ)けた。","Saya merapikan kamar dengan baik."],["ぼんやり","Melamun, samar","窓(まど)の外(そと)をぼんやり眺(なが)めた。","Saya memandangi luar jendela sambil melamun."]]},{"g":"Pencacah (助数詞)","n":"Kata bantu hitung berubah bunyi tergantung bendanya. Hafalkan pengecualiannya.","l":"Cara baca","it":[["〜個(こ)","Benda kecil atau bulat","りんごを三個(さんこ)買(か)った。","Saya membeli tiga apel.","一個(いっこ)・二個(にこ)・三個(さんこ)"],["〜枚(まい)","Benda tipis dan rata","切符(きっぷ)を二枚(にまい)ください。","Tolong dua tiket.","一枚(いちまい)・二枚(にまい)・三枚(さんまい)"],["〜本(ほん)","Benda panjang dan ramping","ペンを三本(さんぼん)持(も)っている。","Saya punya tiga pulpen.","一本(いっぽん)・二本(にほん)・三本(さんぼん)"],["〜冊(さつ)","Buku dan majalah","本(ほん)を五冊(ごさつ)借(か)りた。","Saya meminjam lima buku.","一冊(いっさつ)・二冊(にさつ)・三冊(さんさつ)"],["〜台(だい)","Mesin dan kendaraan","車(くるま)が二台(にだい)止(と)まっている。","Ada dua mobil berhenti.","一台(いちだい)・二台(にだい)・三台(さんだい)"],["〜匹(ひき)","Hewan kecil","猫(ねこ)を三匹(さんびき)飼(か)っている。","Saya memelihara tiga kucing.","一匹(いっぴき)・二匹(にひき)・三匹(さんびき)"],["〜杯(はい)","Gelas atau mangkuk isi","コーヒーを二杯(にはい)飲(の)んだ。","Saya minum dua cangkir kopi.","一杯(いっぱい)・二杯(にはい)・三杯(さんばい)"],["〜回(かい)","Jumlah kali","週(しゅう)に二回(にかい)運動(うんどう)する。","Saya berolahraga dua kali seminggu.","一回(いっかい)・二回(にかい)・三回(さんかい)"],["〜階(かい)","Lantai gedung","三階(さんがい)に会議室(かいぎしつ)がある。","Ruang rapat ada di lantai tiga.","一階(いっかい)・二階(にかい)・三階(さんがい)"],["〜人(にん)","Jumlah orang","五人(ごにん)で旅行(りょこう)した。","Kami berlima bepergian.","一人(ひとり)・二人(ふたり)・三人(さんにん)"],["〜歳(さい)","Usia","弟(おとうと)は十歳(じゅっさい)です。","Adik saya berumur sepuluh tahun.","一歳(いっさい)・二十歳(はたち)"],["〜軒(けん)","Rumah atau toko","この通(とお)りには店(みせ)が三軒(さんげん)ある。","Di jalan ini ada tiga toko.","一軒(いっけん)・二軒(にけん)・三軒(さんげん)"],["〜週間(しゅうかん)","Lama dalam minggu","一週間(いっしゅうかん)休(やす)みます。","Saya libur selama seminggu.","一週間(いっしゅうかん)・二週間(にしゅうかん)"]]}];
